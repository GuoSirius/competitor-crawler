# 模型部署配置（与 .env.example 二选一，env 优先覆盖此处）
# 模式：local=只用本地 / cloud=只用云端 / hybrid=本地优先+云端兜底
mode: hybrid

local:
  baseURL: http://localhost:11434/v1
  apiKey: ollama
  model: qwen2.5:14b-instruct

cloud:
  # 三项默认值与 .env 实际生效组合保持一致（apihub 中转 + agnes-2.5-flash）；
  # 旧值 dashscope + qwen-max 已过时勿改回。.env 的 MODEL_CLOUD_BASE_URL /
  # MODEL_CLOUD_API_KEY / MODEL_CLOUD_MODEL 优先覆盖此处
  baseURL: https://apihub.agnes-ai.com/v1
  apiKey: ${MODEL_CLOUD_API_KEY} # 占位符：interpolateEnv 插值，apiKey 明文不进 yaml
  model: agnes-2.5-flash

# 通用参数（会被 .env 中的 MODEL_TEMPERATURE / MODEL_MAX_RETRIES 覆盖）
temperature: 0
maxRetries: 1

# 各任务可单独覆写
tasks:
  extraction:
    temperature: 0
  normalization:
    temperature: 0
  attribution:
    temperature: 0
  summary:
    temperature: 0
