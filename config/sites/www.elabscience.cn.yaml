# 伊莱瑞特中文站（2026-10-09 配通）
#
# ⚠️ WAF 会话级拦截（非 IP 封禁、非过盾）：
#   首次直进 /search-category=* 列表页会落 403「风险警告，请手动点击跳转」兜页（curl/ssr 亦然）；
#   逛一次首页（任一浏览器内核）即种下会话 Cookie，此后列表/详情全通（实测 headless 亦 200）。
#   会话已持久化 .runtime/state/www.elabscience.cn.json，browserFetch 自动加载。
#   ⚠️ 会话过期后（重新见兜页）需重新预热：headless 跑一次首页再存 state 即可。
#   代码适配器已删除：browser + 持久化会话已覆盖，ssr preflight 无必要（用户 2026-10-09 确认）。
#
# 产品卡 = .product-item（与英文站 .search-list-pro 同平台异构）：
#   名称 a.search-list-title > span.reg_tag；货号 span.reg_tag.cat-no；现价 em.price。
# 翻页 = URL 参数 &page=N（SSR 直出分面与产品格，无需 UI 点击）。
domain: www.elabscience.cn
company: 伊莱瑞特中文站
role: own
currency: CNY
render: browser
startUrl: "https://www.elabscience.cn/search-category=flow-cytometry-antibodies"
listTraversal:
  strategy: pagination-url
  urlTemplate: "&page={page}"
  maxPages: 500
  fallbackToUi: true
parseList:
  itemSelector: ".product-item"
  fields:
    detailUrl:
      sel: 'a.search-list-title'
      attr: href
    name:
      sel: 'a.search-list-title span.reg_tag'
      text: true
    sku:
      sel: 'span.reg_tag.cat-no'
      text: true
    priceText:
      sel: 'em.price'
      text: true
parseDetail:
  fields: {}
  captureRest: true
