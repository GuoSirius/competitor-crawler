# ============================================================================
# 模板 A · 单规则站点配置（config/sites/<domain>.yaml）
# ----------------------------------------------------------------------------
# 适用：一个域名只有「一套」抓取规则（一个列表页/一组同构列表页 + 一种详情页）。
# 用法：复制本文件 → 改名为 <domain>.yaml → 改选择器 → `pnpm probe` 验证。
#      全程无需写代码；模型通用适配器（见 docs/04、docs/05）作为最后兜底。
#
# ★ 本文件是「单规则写法」的穷举示例，覆盖所有可能出现的配置情况。
#   若要「一个站点多套规则」，请用模板 B：config/sites/_template.sections.yaml。
#
# ★★ FieldSpec 字段抽取规范（每个字段只有「三种取值方式 + 两种结构修饰 + 三种附加处理」）★★
#   取值方式（三选一）：
#     1) 取文本        → 不填 attr（或显式 text: true）
#     2) 取属性值      → attr: "href" / "src" / "data-src" …
#     3) 取「一段」    → regex: '...'（优先第 1 捕获组，无捕获组取全匹配）
#   结构修饰（可叠加）：
#     list: true     → 收集所有匹配为「数组」（默认只取第一个）
#     map: {…}       → 在匹配元素内再抽子字段，形成「对象」（配合 list 即「对象数组」）
#   附加处理（可叠加）：
#     number: true   → 结果转数值（去千分位/币种符号），失败为 null（价格等数值列必用）
#     sel: '$self'   → 读「当前元素自身」的文本/属性（读 <option data-price> 这类自带属性）
#     json: true     → 把抽到的字符串当 JSON 解析（页面内联 JSON）
#     jsonPath: "a.b"→ json 后定位到数组/对象所在层级（点号路径，支持数组下标）
#     pick: {…}      → json 后键重命名 { 我方键: 站点键 }
#   取值方式 × 结构修饰 × 附加处理可任意组合。
# ============================================================================

# ---------- 1) 站点标识 ----------
domain: example.com              # 必填；同时是 YAML 文件名与适配器路由键
currency: CNY                    # 站点币种（写入 products.currency）；缺省 CNY，国际站填 USD
startUrl: "https://example.com/products"   # 列表页入口（probe / crawl 抓取起点）

# ---------- 2) 列表遍历（翻页策略）----------
# strategy 五选一：
#   pagination-html : Playwright 点击页码 → 整页重渲染 → cheerio 解析（最常用）
#   pagination-api  : 点击触发 XHR，Playwright 监听 network 取 JSON（稳定无签名时可选）
#   scroll-api      : 滚动到底 → 等待新节点（无限滚动）
#   model-generic   : 找不到稳定结构时，交给模型通用适配器兜底
#   pagination-url  : 用 URL 模板（?page={page} / &p={page}）逐页拼地址抓取，无需浏览器（SSR 站最快最稳）
listTraversal:
  strategy: pagination-html      # 见上；默认 pagination-html
  nextSelector: "a.next"         # 翻页按钮 CSS 选择器（pagination-* 类必填；pagination-url 不需要）
  maxPages: 50                   # 最大翻页数（防死循环；默认 50）
  fallbackToUi: true             # 接口/模型模式失败自动回退 UI 驱动（默认 true，优先浏览器渲染）
  # —— pagination-url 专用字段（其余策略留空即可）——
  # urlTemplate: "?page={page}"  # 含 {page} 占位：完整 URL / 查询串后缀(?page= 或 &p=) / 绝对路径(/c/{page})
  # pageStart: 1                # 可选，起始页码（部分站点从 0 / 2 起算）

# ---------- 3) 列表页解析（每个产品条目 → detailUrl + name）----------
parseList:
  itemSelector: ".product-item"  # 必填：每个产品条目「容器」的选择器
  fields:
    # detailUrl 必填：条目里指向详情页的链接（多规则路由 / 去重都用它）
    detailUrl: { sel: "a", attr: href }
    # name 建议填：列表阶段就能拿到名称，便于样本核对
    name:      { sel: "h3", text: true }
    # —— 列表页也能顺手抽更多字段（可选，写法同 parseDetail）——
    # sku:     { sel: ".sku", text: true, regex: 'SKU[:：]\s*([\w-]+)' }
    # cover:   { sel: "img", attr: "data-src" }
    # tags:    { sel: ".tag", list: true }        # 列表条目上的多标签数组

# ---------- 4) 详情页解析（归一化为 NormalizedProduct）----------
parseDetail:
  fields:
    # ======================================================================
    # 一、三种取值方式（最常用，先吃透这三个）
    # ======================================================================
    # 1) 取文本：不写 attr（或写 text: true）。两行等价，推荐显式 text:true 更可读
    name: { sel: ".pd-name", text: true }
    # name: { sel: ".pd-name" }                       # 与上一行等价（无 attr 即取文本）

    # 2) 取属性值：attr 指定要拿的属性名
    cover:     { sel: "img.cover", attr: src }        # 取图片地址 src
    coverLazy: { sel: "img.cover", attr: "data-src" } # 懒加载图常见 data-src
    detailUrl: { sel: "a.pd-link", attr: href }       # 取链接 href

    # 3) 取「文本/属性中的一段」：regex 优先第 1 捕获组，无捕获组则取全匹配
    cloneNumber: { sel: ".title", text: true, regex: '克隆号[:：]\s*([\w-]+)' } # 从标题抠克隆号
    productId:   { sel: "a.pd-link", attr: href, regex: '/product/(\d+)' }     # 从 URL 抠产品 id
    priceNum:    { sel: ".price", text: true, regex: '[\d,]+\.?\d*' }          # 只留数字（含千分位/小数）

    # ======================================================================
    # 二、list: true —— 收集所有匹配为「数组」
    # ======================================================================
    applications: { sel: ".app-list li", list: true }          # 应用方向数组（每项纯文本）
    keywords:     { sel: ".kw span", list: true, text: true }  # 多个关键词（显式 text:true）

    # ======================================================================
    # 三、嵌套 map —— 在匹配元素内再抽子字段
    # ======================================================================
    # 3a) list + map：每行规格 → 一个对象，组成「对象数组」（最常见：规格表）
    #     ★ 规格 × 多种价格：spec=规格；priceNow=现价；priceOriginal=原价/划线价；
    #       priceActivity=活动价；pricePromo=优惠价/券后价。缺哪个不写即可。
    specs:
      sel: ".spec-row"
      list: true
      map:
        spec:          { sel: ".spec", text: true }
        priceNow:      { sel: ".price-now", text: true, regex: '[\d\.]+' }
        priceOriginal: { sel: ".price-origin", text: true, regex: '[\d\.]+' }   # 原价/划线价
        priceActivity: { sel: ".price-act", text: true }
        pricePromo:    { sel: ".price-promo", text: true }
        buyUrl:        { sel: "a.buy", attr: href }

    # 3a-2) 形态 B：下拉框每个 option 自带属性 → 用 sel: '$self' 读「option 自己」的属性
    #       <select id="spec"><option data-spec="100μL" data-price="1280" data-market-price="1600">
    specsAlt:
      sel: "select#spec option"
      list: true
      map:
        spec:          { sel: "$self", attr: "data-spec" }
        priceNow:      { sel: "$self", attr: "data-price" }
        priceOriginal: { sel: "$self", attr: "data-market-price" }
        priceActivity: { sel: "$self", attr: "data-activity-price" }

    # 3a-3) 形态 C：页面内联 JSON → 用 json + jsonPath + pick 直接映射成 specs
    #       <script>var skuList = [{"specName":"100μL","price":1280}];</script>
    specsInline:
      sel: "script"
      text: true
      regex: 'skuList\s*=\s*(\[[\s\S]*?\]);'   # 抠出 JSON 串（优先第 1 捕获组）
      json: true                               # 解析成数组/对象（宽松：失败时截取最外层 {}/[] 再试）
      jsonPath: "data.skus"                    # 可选：定位到数组所在层级
      pick:                                    # 站点键 → 我方键
        spec: "specName"
        priceNow: "price"
        priceOriginal: "marketPrice"

    # 3b) list + map，map 内再含 attr / regex（介绍图 + 描述）
    introMedia:
      sel: ".intro-block"
      list: true
      map:
        image:       { sel: "img", attr: src }
        description: { sel: ".intro-desc", text: true }

    # 3c) 仅 map（无 list）：取「第一个」匹配内的子字段 → 单个「对象」
    meta:
      sel: ".meta-box"
      map:
        catalog: { sel: ".catalog", text: true }
        batch:   { sel: ".batch", text: true, regex: '批号[:：]\s*(\S+)' }

    # ======================================================================
    # 四、组合示例：list + map + attr + regex 一起上（变体 / SKU 列表）
    # ======================================================================
    variants:
      sel: ".variant"
      list: true
      map:
        sku:   { sel: ".sku", text: true }
        image: { sel: "img", attr: "data-src" }
        url:   { sel: "a", attr: href, regex: '/item/(\d+)' }

    # ======================================================================
    # 五、map 内再 map —— 任意深度嵌套（list+map 套 list+map）
    # ======================================================================
    groups:
      sel: ".group"
      list: true
      map:
        title: { sel: ".g-title", text: true }
        items:
          sel: ".item"
          list: true
          map:
            name: { sel: ".i-name", text: true }
            url:  { sel: "a", attr: href }

  captureRest: true              # ★ 未声明的字段全量进 row 兜底（务必保留，零数据丢失）

  # ==========================================================================
  # 六、【形态 D】异步接口数据源（★ 默认注释掉，需要时才启用）
  # --------------------------------------------------------------------------
  # 规格/价格在选中规格后才由 XHR 返回、静态 HTML 里没有 → probe 会判定为形态 D
  # 并落 NEEDS_API_HINT 告警，同时打印下面这段配置模板。
  # 操作：浏览器 F12 → Network（勾 XHR/Fetch）→ 切一次规格 → 找到请求 → 复制 URL → 填这里。
  #
  # api:
  #   - target: specs                                  # 结果写回：specs / introMedia / 其他名→row
  #     url: "https://example.com/api/goods/{sku}/skus" # {字段名} 用详情页已抽字段插值
  #     method: GET                                     # 默认 GET
  #     headers:
  #       Referer: "https://example.com/"
  #     rootPath: "data.list"                           # 从响应里定位数组
  #     pick:
  #       spec: "specName"
  #       priceNow: "price"
  #       priceOriginal: "marketPrice"
  # ==========================================================================

# ============================================================================
# 附：FieldSpec 速查（复制即用）
# ----------------------------------------------------------------------------
#   纯文本        → { sel: "x", text: true }
#   属性值        → { sel: "x", attr: "href" }
#   文本抽一段    → { sel: "x", text: true, regex: '(\d+)' }
#   属性抽一段    → { sel: "x", attr: "href", regex: '/p/(\d+)' }
#   转数值        → 上面任一 + number: true          （去千分位/币种符号；失败 null）
#   读元素自身    → { sel: "$self", attr: "data-price" }  （★ 读匹配元素自己的属性）
#   内联 JSON     → 上面任一 + json: true [+ jsonPath] [+ pick]
#   多值数组      → 上面任一 + list: true
#   单一子对象    → 上面任一 + map: { key: <FieldSpec> }
#   子对象数组    → list: true + map: { key: <FieldSpec> }
#   任意深度嵌套  → map 内再写 map（见「五、map 内再 map」）
#   异步接口      → parseDetail.api: [{ target, url, rootPath, pick }]（见「六」）
#   模型兜底      → parseDetail.modelFallback: true（形态 E / 懒加载 Tab；读可见文本，只补空）
#                   也可是对象：{ targets: [specs, sku], screenshot: true }；不写=不调模型
#                   ⚠️ 多 Tab 页先看内容在不在 HTML 里（在 → 直接写选择器，不用点击），见 docs/05 §5.3.5
#
# ★ 内置字段（写这些名字会被归一化到 products 对应列，其余一律进 row 兜底）：
#   身份：name / englishName / sourceProductId / sku / detailUrl
#   可比：price / priceText / specText / brand
#   描述：description
#   其他：cloneNumber / applications / specs / introMedia
#   ⚠️ sourceProductId 只装「站点自身产品 id」，没有就留空（绝不用货号兜底，见 docs/03 §3.4）
#   ⚠️ 示例里的 specsAlt / specsInline / meta / variants / groups 不是内置名 → 会进 row
#      （示例用；要用作规格列表请改名为 specs）
#
# 下一步：
#   pnpm probe --domain example.com                 # 单站验证 + ★自动判定规格价格形态（默认抽查 1 个详情页）
#   pnpm probe --domain example.com --detail 3      # 每栏目抽查 3 个详情页
#   pnpm probe --domain example.com --detail 0      # 关闭详情页形态探测
#   pnpm probe --domain example.com --render spa    # 需要 JS 渲染时指定 Playwright
#   pnpm probe --domain example.com --section <key> # 多规则站点只验某个栏目
#   pnpm crawl --site example.com --dry-run --limit 3
# ============================================================================
