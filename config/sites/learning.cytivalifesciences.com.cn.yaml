# 站点适配器：Cytiva（思拓凡学堂中国站）learning.cytivalifesciences.com.cn
# 结构（2026-09-24 实测）：WordPress + WooCommerce
#   - 叶子分类页 ul.products li.product（产品卡）：a(/product/<slug>/) + h2.woocommerce-loop-product__title + .price
#   - 翻页 ?product-page=N；个别分类下还有子分类（li.product-category 已被 :not 过滤，产出 0 条自动停）
#   - 种子品类「特级胎牛血清、马血清」对应 serum 家族；此处按站点真实分类全量接入
domain: learning.cytivalifesciences.com.cn
company: Cytiva
currency: CNY

listTraversal:
  strategy: pagination-url
  urlTemplate: "?product-page={page}"
  pageStart: 1
  maxPages: 10
  fallbackToUi: false

parseList:
  itemSelector: "ul.products li.product:not(.product-category)"
  fields:
    detailUrl: { sel: "a", attr: href }
    name:      { sel: "h2.woocommerce-loop-product__title", text: true }
    price:     { sel: ".price", text: true, regex: '¥\s*([\d,]+\.?\d*)', number: true }

parseDetail:
  fields: {}
  captureRest: true

sections:
  - key: classical-media
    category: 经典细胞培养基
    startUrls:
      - "https://learning.cytivalifesciences.com.cn/product/category/cell-culture-and-fermentation/media-and-feeds/classical-media/"
    match:
      listUrlIncludes: ["https://learning.cytivalifesciences.com.cn/product/category/cell-culture-and-fermentation/media-and-feeds/classical-media/"]
      detailUrlIncludes: ["/product/"]
  - key: specialty-media
