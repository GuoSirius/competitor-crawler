# TODO: 2026-10-09 gen-site 配通后降级 D（接口形态 E）：
#  - 列表可解析（table.table tbody tr，名称/货号 regex 均命中）但行内无 <a> 详情链（category/1、13 实测 0 链接）
#  - 详情页仅 hash SPA #/oneDetails?cid=N，cid 无法由行数据构造
#  - identity_key = COALESCE(source_product_id, canonical(detail_url)) 两头皆空 → crawl.ts:1074 静默丢行
#  - gen 产物内容保留在下方注释外的原配置（曾为正式 www.dojindo.cn.yaml，probe 7 条）
domain: www.dojindo.cn
startUrl: https://www.dojindo.cn/products/category/13
company: 同仁化学研究所 (Dojindo Laboratories)
listTraversal:
  strategy: pagination-html
  nextSelector: null
  maxPages: 50
  fallbackToUi: true
parseList:
  itemSelector: table.table tbody tr
  fields:
    detailUrl:
      sel: td.fonta a
      attr: href
    name:
      sel: td.fonta span.xiahuanxa
      text: true
    sku:
      sel: td.fonta span.xiahuanxa
      text: true
      regex: ^[A-Z0-9][A-Za-z0-9\-]+$
    specText: null
    priceText: null
parseDetail:
  fields:
    name: null
    englishName: null
    cloneNumber: null
    aliases: null
    oldSkus: null
    applications: null
    specs: null
    introMedia: null
  captureRest: true
categoryFromPage:
  itemSelector: .category-breadcrumb a
  strip:
    - 首页
    - 产品中心
  keepLast: true
companyShort: Dojindo 同仁化学
currency: CNY
render: browser
