domain: www.fn-test.cn
company: 菲恩生物（FineTest）
role: own
currency: CNY
render: auto

# 2026-10-02 实测（stubs 4 站之一，下钻）——推翻 2026-09-24 的旧记录
#   旧记录：列表页 https://www.fn-test.cn/elisa-kits/ 卡片容器 div.reference-card、疑似 JS 翻页、形态归 D。
#   实测：/elisa-kits/ 是**营销聚合页**，页面上那 4 个 div.reference-card 是「高分文献」卡片，
#          **不是产品卡**；product-cat/<cat> 归档页才是真产品列表，且**纯 SSR**（浏览器渲染也只多出导航）。
#   真实结构（WordPress + 见见站主题）：
#       列表条目 = <article class="post-<id> ft_product …">（每页 10 条）
#           .entry-title h1 a                        → 英文名 + 详情链接 /product/<sku>/
#           .entry-title span                        → 中文名（如「人白细胞介素6 (IL-6) ELISA试剂盒」）
#           tr:contains(货号) 的第 2 个 td            → 行内「货号：EH0201 反应性：Human」中的货号
#       翻页 = Yoast SEO 输出到 <head> 的 <link rel="next">（body 里没有 nav-links / 分页按钮）
#             → nextSelector 用 'link[rel="next"]'，末页没这个标签就自然停。
#       页数：人ELISA试剂盒约 469 页（title 里「第2页 共469页」），全量 ~4690 条，
#            故 maxPages 先给 10（100 条）试跑，要全量时 CLI --max-pages 覆盖或调大本值。
#   详情页：#copy-button 上挂 data-product-*（标题/价格/货号/链接/货期）；
#           另有 dl.text-sm 的「别称/货号/种属…」label-value 对；其余进 row 兜底。
parseList:
  itemSelector: article.ft_product
  fields:
    detailUrl:
      sel: ".entry-title h1 a"
      attr: href
    name:
      sel: ".entry-title h1 a"
      text: true
    # 中文名不在此处抓：它是站点特有字段（名近内建 name 会被 validate 判 UNKNOWN_FIELD_TYPO 告警），
    # 且详情阶段 captureRest 已把 entry-title 的中文名一起兜底进 row。
    sku:
      sel: "tr:contains(货号)"
      text: true
      # 行内「货号：EH0201 反应性：Human」→ 只取货号格
      regex: '货号[:：]\s*\S+'

listTraversal:
  strategy: pagination-html
  nextSelector: 'link[rel="next"]'
  # 全量约 469 页；先用 10 页（100 条）跑通，需要全量时用 CLI --max-pages 覆盖
  maxPages: 10
  fallbackToUi: false

parseDetail:
  fields:
    name:
      sel: "#copy-button"
      attr: data-product-title
    sku:
      sel: "#copy-button"
      attr: data-product-sku
    # data-product-price="96T:RMB ¥2480" → 规格 / 价格 / 原串 三分开取
    specText:
      sel: "#copy-button"
      attr: data-product-price
      regex: '^([^:]+):'
    price:
      sel: "#copy-button"
      attr: data-product-price
      regex: '¥\s*([\d,]+)'
      number: true
    priceText:
      sel: "#copy-button"
      attr: data-product-price
    # 货期（如「现货」）；别称/种属等 label-value 对由 captureRest 进 row
    delivery:
      sel: ".product-delivery-time"
      text: true
  captureRest: true

sections:
  - key: elisa-human
    category: 人ELISA试剂盒
    startUrls: ["https://www.fn-test.cn/product-cat/human-elisa-kit/"]
    match: { detailUrlIncludes: ["fn-test.cn/product/"] }
