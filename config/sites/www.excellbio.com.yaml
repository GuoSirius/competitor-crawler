# 站点适配器：苏州依科赛生物（Excellbio）www.excellbio.com
# 结构（2026-09-24 实测）：ASP.NET，与 xpbiomed 同款
#   - 列表页 /productcenter/list.aspx?lcid=N（栏目导航全量已枚举，30 个产品栏目）
#   - 产品卡 div.con：figure>a(info.aspx?itemid=) + h3>a.dot(名称) + span.dot2(简介)
#   - 翻页：真实 URL &page=N
#   - 注：定制化服务(273/364/259)、科赋思(366)、案例分析(269) 非产品栏目，未接入
domain: www.excellbio.com
company: 苏州依科赛生物科技股份有限公司
currency: CNY

listTraversal:
  strategy: pagination-url
  urlTemplate: "&page={page}"
  pageStart: 1
  maxPages: 20
  fallbackToUi: false

parseList:
  itemSelector: "div.con"
  fields:
    detailUrl: { sel: "a[href*='info.aspx?itemid=']", attr: href }
    name:      { sel: "h3 a.dot", text: true }
    summary:   { sel: "span.dot2", text: true }

parseDetail:
  fields: {}
  captureRest: true

sections:
