# 站点适配器：ABclonal 爱博泰克 abclonal.com.cn
# 结构（2026-10-10 改版重建）：自研商城（ssr 直出），ThinkPHP 形态
#   - 列表卡 div.products-box.clearfix；产品名/链接 a.product-title-style（href=/catalog/<货号>）
#   - 列表无价格（价格在详情页）；翻页 ?&p=N（站点原生分页链接带 ?& 前缀）
#   - ⚠️ 站点改版：分类 URL 从 /<slug>/ 迁移到 /product/<slug>；旧 URL 只剩残页
#   - ⚠️ 顶级/中级分类页【不聚合子孙产品】（实测 polyclonal 叶 8946 条 vs 父级 293 条）
#     → startUrls 必须用叶子分类（导航树 11 顶级 / 165 叶，按顶级分节）
#   - sections 按顶级分类分节，每节挂其下全部叶子入口（各入口独立翻页，maxPages 默认 1000 兜底）
# 抓取命令：pnpm crawl --domain abclonal.com.cn
domain: abclonal.com.cn
company: "武汉爱博泰克生物科技有限公司"
companyShort: "ABclonal"
currency: CNY
render: ssr # 列表/详情均服务端直出

parseList:
  itemSelector: "div.products-box.clearfix"
  fields:
    detailUrl: { sel: "a.product-title-style", attr: href }
    name: { sel: "a.product-title-style", text: true }
    # 货号 = /catalog/A5437 中的 A5437
    sku: { sel: "a.product-title-style", attr: href, regex: '/catalog/([A-Za-z0-9]+)' }

parseDetail:
  fields:
    # 详情数据在内联 JS 变量：priceStr='50 μL,1260,In Stock|5x 100 μL,3300,...'（规格,价格,库存|...）
    # YAML 单引号字符串：内嵌单引号写 ''，正则反斜杠单写
    price:
      sel: 'script:contains(priceStr)'
      text: true
      regex: 'priceStr = $.trim\(''[^'']*?,(\d+)'
      number: true # 取首个规格价
    specText:
      sel: 'script:contains(priceStr)'
      text: true
      regex: 'priceStr = $.trim\(''([^,]+),'
    species:
      sel: 'script:contains(field_s1)'
      text: true
      regex: 'field_s1 = $.trim\(''([^'']+)'')'

sections:
