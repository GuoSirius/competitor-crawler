render: browser
listTraversal:
  strategy: none            # 家族页单页列出全部产品，无翻页
parseList:
  itemSelector: 'a[href*="ecatalog.corning.com"][href*="/p/"]'
  fields:
    detailUrl: { sel: '$self', attr: href }
    sourceProductId: { sel: '$self', attr: href, regex: 'p/([^/?#]+)' }
parseDetail:
  fields:
    name:      { sel: 'h1', text: true }
    sku:       { sel: 'a[href*="pagePath=p/"]', attr: href, regex: 'pagePath=p/(\d+)' }
    price:     { sel: 'p.price', text: true, regex: '\$([\d,]+\.\d{2})', number: true }
    priceText: { sel: 'p.price', text: true }
    specs:
      sel: 'table.productsTable__table tbody tr'
      list: true
      map:
        sku:       { sel: 'td:nth-child(1) span.tablesaw-cell-content', text: true }  # Product Number
        name:      { sel: 'td:nth-child(2) span.tablesaw-cell-content', text: true }  # Product Name
        priceText: { sel: 'td:nth-child(6) span.tablesaw-cell-content', text: true }  # Price
        unitSize:  { sel: 'td:nth-child(7) span.tablesaw-cell-content', text: true }  # Unit Size
  captureRest: true         # 规格/描述等全量进 row 兜底
