# 站点适配器：诺唯赞 Vazyme（2026-10-08 实测接入）
# 平台：faststatics 模块化 CMS，产品网格由客户端 ES 查询渲染。
# ⚠️ 三层结构（用户确认）：枢纽页 → 中间聚合页（各子模块 size:6 截断 + 「更多>>」）→ 最后一级=真实列表。
#   startUrls 即 v5 BFS 枚举的 187 个最后一级分类页（判据=无「更多>>」按钮，中间分类全部忽略）。
# 结构（最后一级页）：
#   div.p_loopitem   → 卡片（含产品卡与子分类卡两种，靠 match.detailUrlIncludes 过滤）
#     a[href*=/product/] 第一处 → 产品名（p.e_text-3.s_title）
#     .cbox-2-1 .e_text-8 a     → 货号（如 P051-01/02）
# 翻页：p_page 控件 URL 型（<id>-12-<page>.html，内部 id 与入口别名不同）→ 用 pagination-html
#   点击 a.page_next；末页 disabled class 引擎自动收尾（clickNext 判定）。
domain: bio.vazyme.com
company: 诺唯赞（Vazyme）
role: competitor
currency: CNY
render: browser

parseList:
  itemSelector: div.p_loopitem
  fields:
    detailUrl: { sel: "a[href*='/product/']", attr: href }
    name: { sel: "p.e_text-3.s_title a[href*='/product/']", text: true }
    sku: { sel: ".cbox-2-1 .e_text-8 a", text: true }

listTraversal:
  strategy: pagination-html
  nextSelector: "a.page_next"
  maxPages: 50
  waitSelector: "div.p_loopitem a[href*='/product/']" # 等 ES 查询渲染出真产品卡

parseDetail:
  fields:
    name: { sel: "h1", text: true }
    sku: { sel: ".cbox-28-1 p", text: true } # 货号盒（P051-01）
    price: { sel: "p:contains('¥')", text: true, regex: '[\d,]+\.?\d*', number: true }
    priceText: { sel: "p:contains('¥')", text: true }
    specText: { sel: "li.p_active .specValueT", text: true } # 当前选中规格（100 U）
  captureRest: true

sections:
  - key: products
    category: 诺唯赞产品
    startUrls:
