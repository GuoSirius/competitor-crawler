# 站点适配器：Bio X Cell（bioxcell.com，Magento + Algolia instant search）
# 结构（2026-10-02 实测）：
#   - 列表页产品卡由 Algolia 前端渲染 li.ais-InfiniteHits-item（每页 10 条），必须 spa；
#     URL 参数 ?page=N 翻页；`{{url}}` 只是 algolia autocomplete 的 text/template 脚本，非未挂载模板
#   - 卡片字段：a.result 链接 + span.result-title 名称 + .prd-item.Catalog p 货号（BE0146）
#     + .prd-item.Clone p 克隆号；价格在卡内 select option data-price（规格×多价，详情页为准）
#   - 详情页是 Magento 标准页（/invivomab-anti-mouse-pd-1-cd279-be0146 形态）
# 抓取命令：pnpm crawl --domain bioxcell.com
domain: bioxcell.com
company: Bio X Cell
currency: USD
render: spa # Algolia instant search 前端渲染

parseList:
  itemSelector: "li.ais-InfiniteHits-item"
  fields:
    detailUrl: { sel: "a.result", attr: href }
    name: { sel: "span.result-title", text: true }
    sku: { sel: ".prd-item.Catalog p", text: true }
    cloneNumber: { sel: ".prd-item.Clone p", text: true }

parseDetail:
  fields:
    name: { sel: "h1", text: true }
    sku:
      sel: ".catalog-no"
      text: true
      regex: '#\s*([A-Za-z0-9]+)' # Catalog #BE0146 → BE0146
    price:
      sel: "h2.product-price span.price"
      text: true
      regex: '([\d,]+\.?\d*)'
      number: true # 首个 span = 最低规格价 $178.00
    priceText: { sel: "h2.product-price", text: true } # "$178.00 - $4,841.50"

sections:
  - key: in-vivo-antibodies
    category: 体内抗体
    startUrls: ["https://bioxcell.com/in-vivo-antibodies"]
    match: { detailUrlIncludes: ["bioxcell.com/"] }
    # Algolia instant search（urlSync 开启）：URL ?page=N 可直连（用户实测刷新 page=N 只显示
    # 第 N 页；探针 page=2→NK1.1/BE0036、page=3→IL-6/BE0046 均为对应页数据）——用 URL 翻页。
    # 注意：直连状态恢复比首屏更慢（10~120s 波动）；waitSelector 必须用内容级选择器——
    # Algolia 渲染完成前 li 容器不可见，只有内容填充后 .result-title 才出现（浅层会假超时）。
    # 爬取须带 CRAWL_SPA_MAX_WAIT=120（waitSelector 超时上限取该值）。
    listTraversal: { strategy: pagination-url, urlTemplate: "?page={page}", maxPages: 100, waitSelector: "li.ais-InfiniteHits-item .result-title" }
