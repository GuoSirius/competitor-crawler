# 站点适配器：Bio X Cell（bioxcell.com，Magento + Algolia instant search）
# 结构（2026-10-02 二次实测）：
#   - 列表页产品卡由 Algolia 前端渲染 li.ais-InfiniteHits-item（首屏 10 条），必须 browser；
#     `{{url}}` 只是 algolia autocomplete 的 text/template 脚本，非未挂载模板
#   - 翻页 = 底部「View More」按钮（button.ais-InfiniteHits-loadMore），点击**累积**追加：
#     连点 3 次实测 10→20→30→40，URL 同步变 ?page=4（刷新只出本页、不回吐 1~3 页）。
#     这正是 pagination-html 的适用场景——比逐页冷启动 ?page=N（pagination-url）稳得多。
#   - ⚠️ 站点把 headless 默认 UA（Playwright 自带版本）直接 403 Forbidden（curl 换浏览器 UA 即 200）；
#     engine 默认 mid 档 stealth 只抹 webdriver/plugins，**不改 UA**，故必须显式写 antiBot.userAgent。
#   - 卡片字段：a.result 链接 + span.result-title 名称 + .prd-item.Catalog p 货号（BE0146）
#     + .prd-item.Clone p 克隆号；价格在卡内 select option data-price（规格×多价，详情页为准）
#   - 详情页是 Magento 标准页（/invivomab-anti-mouse-pd-1-cd279-be0146 形态）
# 抓取命令：pnpm crawl --domain bioxcell.com
domain: bioxcell.com
company: "Bio X Cell, Inc."
companyShort: "Bio X Cell"
currency: USD
render: browser # Algolia instant search 前端渲染
# 不配 antiBot：引擎默认（有头 + 默认 UA）实测能过；换成自定义 UA 会与 antiBot.ts 里
# 写死的 sec-ch-ua「Chromium 124」不自洽，画蛇添足。

parseList:
  itemSelector: "li.ais-InfiniteHits-item"
  fields:
    detailUrl: { sel: "a.result", attr: href }
    name: { sel: "span.result-title", text: true }
    sku: { sel: ".prd-item.Catalog p", text: true }
    cloneNumber: { sel: ".prd-item.Clone p", text: true }

parseDetail:
  fields:
    name: { sel: "h1", text: true }
    sku:
      sel: ".catalog-no"
      text: true
      regex: '#\s*([A-Za-z0-9]+)' # Catalog #BE0146 → BE0146
    price:
      sel: "h2.product-price span.price"
      text: true
      regex: '([\d,]+\.?\d*)'
      number: true # 首个 span = 最低规格价 $178.00
    priceText: { sel: "h2.product-price", text: true } # "$178.00 - $4,841.50"

sections:
  - key: in-vivo-antibodies
    category: 体内抗体
    startUrls: ["https://bioxcell.com/in-vivo-antibodies"]
    match: { detailUrlIncludes: ["bioxcell.com/"] }
    # Algolia instant search：View More 按钮（非滚动触发）。pagination-html 单实例主循环
    # 拟人点击累积加载（warm 渲染，成功率远高于逐页冷启动的 pagination-url）；
    # 累积 DOM 每轮重解析 + 列表末尾统一去重；按钮消失即终止。
    # waitSelector 用**内容级**选择器（浅层容器在 Algolia 重挂载时会被清空，见 fetch/page.ts
    # 「两阶段渲染复查」）：命中即证明 hits 结果已填充。CRAWL_BROWSER_MAX_WAIT 建议 150000（首屏 ~57s）。
    listTraversal: { strategy: pagination-html, nextSelector: "button.ais-InfiniteHits-loadMore", maxPages: 200, waitSelector: "li.ais-InfiniteHits-item .result-title" }
