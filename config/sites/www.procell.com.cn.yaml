# ⚠️ gen-site 自动生成（2026-09-30）——以下字段在真实页面回验中未命中，人工确认选择器后再正式使用：
#   - 详情页字段未命中（值为空）：aliases——若站点确实没有该字段可忽略，否则请修正选择器
domain: www.procell.com.cn
startUrl: https://www.procell.com.cn/search
listTraversal:
  strategy: pagination-html
  nextSelector: null
  maxPages: 50
  fallbackToUi: true
parseList:
  itemSelector: .searchs-list-content.row
  fields:
    detailUrl:
      sel: a.s-name-bold
      attr: href
    name:
      sel: a.s-name-bold
      text: true
    sku:
      sel: .js-huohao
      text: true
      regex: ^\d+$
    specText:
      sel: p:has(> span.bold:contains('规格'))
      text: true
    priceText:
      sel: p:has(> span.bold:contains('价格'))
      text: true
parseDetail:
  fields:
    name:
      sel: h1.js-p-title
      text: true
    englishName:
      sel: p:has(> span:contains('英文名称：'))
      text: true
      regex: 英文名称[：:](.*)
    aliases:
      sel: span:contains('曾用名：')
      text: true
      regex: 曾用名[：:](.*)
    oldSkus:
      sel: span:contains('曾用货号：')
      text: true
      regex: 曾用货号[：:](.*)
    specs:
      sel: table.table-bordered-white tr
      list: true
      map:
        spec:
          sel: td.size_span
          text: true
        priceNow:
          sel: td.price_span span
          text: true
          number: true
    introMedia:
      sel: "#pro-carouselExampleCaptions .carousel-item.img-box img"
      list: true
      map:
        image:
          sel: img
          attr: src
captureRest: true
categoryFromPage:
  itemSelector: nav[aria-label='breadcrumb'] .breadcrumb-item
  strip:
    - 当前位置
    - 首页
  keepLast: true
company: 普诺赛中文站
role: own
currency: 元
render: auto
