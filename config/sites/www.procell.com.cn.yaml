domain: www.procell.com.cn
company: 普诺赛中文站
role: own
currency: 元
render: auto

# URL 模板翻页：产品 /search?page=N、资源 /resource/xxx?page=N 同款（SSR 站最快最稳；解析 0 条自动停）
listTraversal:
  strategy: pagination-url
  urlTemplate: "?page={page}"
  pageStart: 1
  maxPages: 10000
  fallbackToUi: true

sections:
  # ── 产品管线（原单规则平移，行为零变化；写库 products 表）──
  - key: products
    startUrls: [https://www.procell.com.cn/search]

    # 面包屑动态分类：详情页 .breadcrumb = 当前位置/首页/血清 → 爬取时自动建分类树
    categoryFromPage:
      itemSelector: ".breadcrumb li"
      strip: ["当前位置", "首页"]
      keepLast: true # 末段「血清」是分类名，须保留

    parseList:
      itemSelector: .searchs-list-content
      fields:
        detailUrl:
          sel: ".s-list-div:nth-child(1) a"
          attr: href
        # data-title 是干净中文名（不带货号括注）
        name:
          sel: ".s-list-div:nth-child(1) a"
          attr: data-title

    parseDetail:
      captureRest: true
      fields:
        # 中文名：优先 .detail-table 的「产品名称」行（纯净名；行序不固定按 label 选行）。
        # h1.js-p-title 是「名称+附加信息」混合串（如 293T…(STR鉴定正确)）不采用。
        # 血清类无此行 → null → 落库时回退列表页 data-title（同样干净）。
        name:
          sel: "tr:contains(产品名称) td.d-content"
          text: true
        englishName:
          sel: ".js-en-title"
          text: true
        sku:
          sel: ".js-huohao"
          text: true
        # 曾用货号（分号拼接串，含现用）；按 label 文本定位，比行号稳
        oldSkus:
          sel: ".produc-canshu p:contains(曾用货号) span:nth-child(2)"
          text: true
        # 别称（细胞系等页面 .detail-table 有此行，分号拼接；血清类无此行 → null）
        aliases:
          sel: "tr:contains(别称) td.d-content"
          text: true
        # 种属（无独立列 → 进 row 兜底）
        种属:
          sel: "tr:contains(种属) td.d-content"
          text: true
        # 默认规格快照：price/specText 不会自动从 specs[0] 推导，必须显式声明（tr:not([class]) 跳过表头行）
        # specText 与 specs[].spec 同口径：同样剥离结尾括注
        specText:
          sel: ".produc-canshu table tr:not([class]) .size_span"
          text: true
          regex: '^(.*?)\s*(?:[（(][^）)]*[）)])?\s*$'
        price:
          sel: ".produc-canshu table tr:not([class]) .price_span"
          text: true
          number: true
        priceText:
          sel: ".produc-canshu table tr:not([class]) .price_span"
          text: true
        specs:
          sel: ".produc-canshu table tr:not([class])"
          list: true
          map:
            spec:
              sel: ".size_span"
              text: true
              # 剥离结尾的（常温）/(冻存) 等括注 → 干净规格名；无括注时整段保留
              regex: '^(.*?)\s*(?:[（(][^）)]*[）)])?\s*$'
            # 括注单独存（如「常温」），与 spec 成对；无括注为 null
            condition:
              sel: ".size_span"
              text: true
              regex: "[（(]([^）)]+)[）)]"
            priceNow:
              sel: ".price_span"
              text: true
              number: true
        introMedia:
          sel: "#carouseldetail .carousel-inner .carousel-item"
          list: true
          map:
            image:
              sel: img
              attr: src
            # 视频项 = B 站播放器 iframe（纯图片项为 null）；Web 展示侧按 video 渲染
            video:
              sel: "iframe"
              attr: src
            description:
              sel: img
              attr: data-title

  # ── 内容管线：技术资源（写库 contents 表，contentType 区分类型）──
  # 详情页统一锚点（4 类同构）：
  #   og meta = 标题/摘要/发布日期（og:release_date 与 border-article 内标准日期二选一，后者正则取日期）
  #   .border-article = 来源/浏览量/发布时间
  #   正文 = h1 所在 section 的相邻下一个 section（纯 p/h4/ol 富文本）
  # 面包屑末段是文章标题（active）→ keepLast: false，剥「技术资源」后分类=栏目名（细胞学堂等）
  #
  # resource/material（宣传资料）：Vue SPA（#app 空壳，数据走 /api/resource/material XHR），
  # 条目直接是文件下载直链、无详情页 → listOnly 仅列表模式 + renderList: spa 浏览器渲染。
  # 纯列表无翻页控件：数据一次 XHR 全量返回 → 必须显式关停翻页。
  # 站点顶层的 pagination-url（`?page={page}`）是给 hero 产品 /resource 栏目真分页用的；
  # material 若静默继承，每页都返回全量 → onPage 恒 >0 → 一路翻到 maxPages 上限，白抓上千页。
  # 引擎侧对 listOnly 栏目本就默认单页（loader.LIST_ONLY_TRAVERSAL），
  # 此处再显式写 `strategy: none` 只是为了可读 + 防后人误删，二者互为兜底。
  # 即便重复抓取，seenSet + upsert 幂等双兜底，不会产生重复行。

  - key: material
    contentType: material # 宣传资料
    renderList: spa # 列表数据靠 JS 渲染，必须浏览器模式
    startUrls: [https://www.procell.com.cn/resource/material]
    listOnly: true # 仅列表模式：条目=文件直链，无详情阶段，列表快照直接入库
    # 局部禁翻页（顶层配置不动，仅本栏目关停）：只抓第一页，不做任何翻页
    listTraversal:
      strategy: none
    categoryFromPage:
      itemSelector: ".breadcrumb li"
      strip: ["当前位置", "首页"]
      keepLast: false
    parseList:
      # 渲染后的卡片：.xc-content 内 img[alt]=标题、.xc-download a=下载直链（SPA 模板结构）
      itemSelector: .xc-content
      fields:
        detailUrl:
          sel: ".xc-download a"
          attr: href
        name:
          sel: img
          attr: alt
        cover:
          sel: img
          attr: src

  - key: resource-alerts
    contentType: products-alerts # 新品速递
    startUrls: [https://www.procell.com.cn/resource/products-alerts]
    categoryFromPage:
      itemSelector: ".breadcrumb li"
      strip: ["当前位置", "首页"]
      keepLast: false
    parseList:
      itemSelector: .huodong-list
      fields:
        detailUrl:
          sel: a
          attr: href
        name:
          sel: ".article-title"
          text: true
        sourceId:
          sel: a
          attr: href
          # 兼容两种 URL 形态：/school/527（id 独立）与 /school/thp-1-506（slug-id 结尾）
          # 前缀 [-/] 缺一不可——只写 /(\d+) 时后者斜杠后是字母，会静默抽不到 id → 退化成 canonical(url)
          regex: '[-/](\d+)(?:$|\?|#)'
    parseDetail:
      fields:
        name:
          sel: ".ryzz"
          text: true
        description:
          sel: 'meta[property="og:description"]'
          attr: content
        # 「发布时间：2026-06-26」→ row.date → parseDateStr 转 Unix 秒
        date:
          sel: ".border-article span:contains(发布时间)"
          text: true
          regex: '(\d{4}-\d{1,2}-\d{1,2})'
        author:
          sel: ".border-article span:contains(来源)"
          text: true
          regex: "来源：(.*)"
        body:
          sel: "section:has(.ryzz) + section"
          text: true
        # 富文本留存（非必配）：抽同一正文容器的 innerHTML → contents.body_html 列
        # 不配则不抽，body_html 恒 null；material 等 listOnly 栏目无详情阶段，天然不加
        bodyHtml:
          sel: "section:has(.ryzz) + section"
          html: true

  - key: school
    contentType: school # 细胞学堂
    startUrls: [https://www.procell.com.cn/resource/school]
    categoryFromPage:
      itemSelector: ".breadcrumb li"
      strip: ["当前位置", "首页"]
      keepLast: false
    parseList:
      itemSelector: .huodong-list
      fields:
        detailUrl:
          sel: a
          attr: href
        name:
          sel: ".article-title"
          text: true
        sourceId:
          sel: a
          attr: href
          # 兼容两种 URL 形态：/school/527（id 独立）与 /school/thp-1-506（slug-id 结尾）
          # 前缀 [-/] 缺一不可——只写 /(\d+) 时后者斜杠后是字母，会静默抽不到 id → 退化成 canonical(url)
          regex: '[-/](\d+)(?:$|\?|#)'
    parseDetail:
      fields:
        name:
          sel: ".ryzz"
          text: true
        description:
          sel: 'meta[property="og:description"]'
          attr: content
        date:
          sel: ".border-article span:contains(发布时间)"
          text: true
          regex: '(\d{4}-\d{1,2}-\d{1,2})'
        author:
          sel: ".border-article span:contains(来源)"
          text: true
          regex: "来源：(.*)"
        body:
          sel: "section:has(.ryzz) + section"
          text: true
        # 富文本留存（非必配）：同一正文容器的 innerHTML → contents.body_html 列；不配则不抽
        bodyHtml:
          sel: "section:has(.ryzz) + section"
          html: true

  - key: guide
    contentType: guide # 实验操作指南（列表为 ul.guide-list 简单条目，无摘要/日期）
    startUrls: [https://www.procell.com.cn/resource/guide]
    categoryFromPage:
      itemSelector: ".breadcrumb li"
      strip: ["当前位置", "首页"]
      keepLast: false
    parseList:
      itemSelector: ul.guide-list li
      fields:
        detailUrl:
          sel: a
          attr: href
        name:
          sel: span
          attr: title
        sourceId:
          sel: a
          attr: href
          # 兼容两种 URL 形态：/school/527（id 独立）与 /school/thp-1-506（slug-id 结尾）
          # 前缀 [-/] 缺一不可——只写 /(\d+) 时后者斜杠后是字母，会静默抽不到 id → 退化成 canonical(url)
          regex: '[-/](\d+)(?:$|\?|#)'
    parseDetail:
      fields:
        name:
          sel: ".ryzz"
          text: true
        description:
          sel: 'meta[property="og:description"]'
          attr: content
        date:
          sel: ".border-article span:contains(发布时间)"
          text: true
          regex: '(\d{4}-\d{1,2}-\d{1,2})'
        author:
          sel: ".border-article span:contains(来源)"
          text: true
          regex: "来源：(.*)"
        body:
          sel: "section:has(.ryzz) + section"
          text: true
        # 富文本留存（非必配）：同一正文容器的 innerHTML → contents.body_html 列；不配则不抽
        bodyHtml:
          sel: "section:has(.ryzz) + section"
          html: true

  - key: video
    contentType: video # 实验视频（卡片标题是第二个 a 的文本；正文区为 B 站 iframe）
    startUrls: [https://www.procell.com.cn/resource/video]
    categoryFromPage:
      itemSelector: ".breadcrumb li"
      strip: ["当前位置", "首页"]
      keepLast: false
    parseList:
      itemSelector: .huodong-list
      fields:
        detailUrl:
          sel: a
          attr: href
        name:
          sel: "a.px-2"
          text: true
        sourceId:
          sel: a
          attr: href
          # 兼容两种 URL 形态：/school/527（id 独立）与 /school/thp-1-506（slug-id 结尾）
          # 前缀 [-/] 缺一不可——只写 /(\d+) 时后者斜杠后是字母，会静默抽不到 id → 退化成 canonical(url)
          regex: '[-/](\d+)(?:$|\?|#)'
        cover:
          sel: "a.video-img img.w-100"
          attr: src
    parseDetail:
      fields:
        name:
          sel: ".ryzz"
          text: true
        description:
          sel: 'meta[property="og:description"]'
          attr: content
        date:
          sel: ".border-article span:contains(发布时间)"
          text: true
          regex: '(\d{4}-\d{1,2}-\d{1,2})'
        author:
          sel: ".border-article span:contains(来源)"
          text: true
          regex: "来源：(.*)"
        # B 站播放器地址（row 兜底列；contents 表无 introMedia 专列）
        videoUrl:
          sel: ".vedio-content iframe"
          attr: src
        body:
          sel: "section:has(.ryzz) + section"
          text: true
        # 富文本留存（非必配）：同一正文容器的 innerHTML → contents.body_html 列；不配则不抽
        bodyHtml:
          sel: "section:has(.ryzz) + section"
          html: true
