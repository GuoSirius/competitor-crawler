# ============================================================================
# 模板 B · 多规则站点配置（config/sites/<domain>.yaml）
# ----------------------------------------------------------------------------
# 适用：同一个域名下有多套抓取规则，例如：
#   · 一个站点有多个列表页，各自结构不同（「全部产品」/「促销专区」/「新品」…）；
#   · 每个列表页对应各自的详情页模板，抽取字段不一致；
#   · 产品栏目 + 资讯栏目（news / announcement / document…）混排在同一站。
# 用法：复制本文件 → 改名为 <domain>.yaml → 按栏目改选择器 → `pnpm probe` 验证。
#      全程无需写代码；代码型适配器（adapters/<domain>.ts）只做 YAML 表达不了的加性补充。
#
# ★★ config/sites/ 目录是爬取范围的唯一真相源（crawl 默认 --source config）★★
#   放一个 <domain>.yaml 就爬一个站，删掉就不爬；seed Excel 仅作一次性初始化导入。
#
# ★ 核心机制（代码见 packages/crawler/src/config/{types,loader}.ts）
#   1) 每个 section 自带：key + startUrls + match + listTraversal + parseList + parseDetail；
#   2) 顶层字段（listTraversal / parseList / parseDetail / 渲染 / 代理 / 反爬 / 分类）是「公共默认值」，
#      section 未写的项按继承规则自动补齐（见「附 A」优先级表）；
#   3) 列表阶段给每条 ListItem 打上 sectionKey → 详情阶段「按 sectionKey 选规则」，零歧义；
#   4) 去重口径 B：同一 SKU / 同一条内容出现在两个 section 时，「分开为两条」
#      —— products 唯一键为 (company_id, identity_key, section_key)，
#         contents 唯一键为 (company_id, identity_key, section_id)；
#         适合「同 SKU 在不同栏目详情内容确实不同」的场景。
#
# ★ 归一化规则（resolveSections）：
#   · 写 sections  → 逐 section 合并顶层默认值；key 缺省补 'default'，name 缺省回退 key；
#   · 不写 sections → 把顶层 startUrl + parseList + parseDetail 包成单个 key='default' 的栏目（模板 A 写法）。
#   两种写法可共存：顶层既做默认值、又兼容「部分栏目想复用公共规则」。
#
# ★ 采集类型路由（section.contentType，产品 + 资讯混排就靠它）：
#   · contentType: products（缺省，特殊值）→ 走产品管线落 products 表（价格/规格/去重/软删全能力）；
#   · contentType: news / announcement / document / …其他值 → 走内容管线落 contents 表（content_type=该值）；
#   · 同一 YAML 的 sections 可混排：几个产品栏目 + 一个新闻栏目，各管各的表、互不干扰；
#   · 内容栏目同样参与分类建树（category / categoryFromPage / categoryPath 生效，写入 contents.category_id）；
#     productLine 作为 section 级过滤维度对 contents 同样可用（`crawl --product-line` 会一并过滤），
#     但 contents 自身不依赖产品线字段。
#   · 内容字段映射（toPendingContent，详见「附 C」）：
#     name → title；summary/description → summary；body/content/text → body；
#     author/source → author；date/publishedAt/publishTime/publishDate/time → publishedAt（自动转 Unix 秒）；
#     bodyHtml 需 YAML 显式配 html:true；其余字段进 row JSON。
#   · 去重键 = COALESCE(source_id, canonical(detail_url))，软删口径与产品一致（连续 2 轮缺失下架）。
#
# ★ 每个 section 的 parseDetail 均可单独配 `api:`（异步接口数据源，形态 D，见模板 A「六」）
#   与 `modelFallback:`（模型兜底，形态 E，见模板 A「七」）；render / renderList / renderDetail /
#   antiBot / proxy / categoryFromPage 也都能在 section 级单独覆盖（见「附 A」）。
#
# ★ FieldSpec 字段抽取规范与模板 A 完全一致（见下方「0)」），此处完整重列以便本文件独立阅读。
# ============================================================================

# ---------- 0) FieldSpec 字段抽取规范（所有 parseList/parseDetail 字段的统一写法）----------
# 每个字段由以下能力组合而成（单一事实源 = packages/shared/src/adapter/spec.ts）：
#
#   【取值方式 · 四选一，决定从元素取哪类内容】
#     1) 取文本   → 不写 attr（或显式 text: true）
#     2) 取属性值 → attr: "href" / "src" / "data-src" …
#     3) 取「一段」→ regex: '...'（在取值结果上抠第 1 捕获组，无捕获组取全匹配）
#     4) 取富文本 → html: true（取 innerHTML，如 contents 的 bodyHtml；仅显式要求保留标签时用）
#     · 取值优先级：attr > html > text（同时写 attr 与 html 时以 attr 为准）；
#       regex 是对取值结果的「二次截取」，可与 text/attr/html 任一叠加。
#
#   【结构修饰 · 可叠加】
#     list: true → 收集所有匹配为「数组」（默认只取第一个）
#     map:  {…}  → 在匹配元素内再抽子字段，形成「对象」（配合 list 即「对象数组」）
#
#   【标量强转 · 可叠加，把字符串结果转成对应类型】
#     number: true → 转数值（去千分位/币种符号，失败 null；价格等数值列必用）
#     bool:   true → 转布尔（真值：有货/现货/true/1/是/有/在售/正常…；假值：缺货/下架/false/0/无/否/停售/售罄…；
#                       表外值返回 null 不猜测）
#
#   【JSON 处理 · 可叠加；json:true 开启后 jsonPath/pick 才生效】
#     json:     true → 把抽到的字符串当 JSON 解析（页面内联 JSON / 接口响应，宽松容错）
#     jsonPath: "a.b" → json 后定位到数组/对象所在层级（点号路径，支持数组下标）
#     pick:     {…}   → json 后键重命名 { 我方键: 站点键 }
#
#   【选择器哨兵 · 非取值方式，是 sel 的特殊值】
#     sel: "$self" → 读「当前元素自身」的文本/属性（读 <option data-price> 这类自带属性）
#
#   【固定值 · 与 DOM 无关，每条记录直接落该值】
#     const: 值 → 不写 sel，写什么落什么（标量/数组/对象均可）。
#       用途：打固定标签/补站点级元数据，如 category: { const: 抗体 }、tags: { const: [热销, 新品] }。
#       与 sel 同写时 const 优先；不参与 number/bool 强转；
#       ⚠️ 含前导零/日期形态的字符串必须加引号（{ const: "00123" }），否则 YAML 会解析成数值/日期。
#
#   上述可任意组合，如 { sel, text, regex, number } 抠价格数值；{ sel, list, map } 抽规格数组。
#   ⚠️ 不存在 `sel: ".x"` 简写，也不存在 `img@src` 这类「选择器@属性」简写——属性必须用 attr: 声明。

# ---------- 1) 站点标识（公司按 domain 唯一判别；同公司多域名各建一行、共用同一 company 名）----------
domain: example.com              # 必填；同时是 YAML 文件名与适配器路由键（仅允许 字母/数字/./-_，不含 ..）
company: 示例生物科技有限公司      # 站点归属公司规范全名（写入 companies.name；省略时回退为 domain）
                                 # ★ 公司按 domain 唯一判别：同一公司多个域名 → 各配一个 YAML（共用同一 company 名，
                                 #   每个域名一行 companies，website 随域名各自维护）；company 仅作展示/检索标签。
# companyShort: 普诺赛             # 市场部简称标签（可选；落 companies.short_name，展示用；与 company 规范全名区分）
# competitorType: 多肽合成试剂     # 竞品类型（可选；写入 companies.competitor_type，供筛选/分组）
# role: competitor               # 公司角色（可选）：own=我方 / competitor=竞品（缺省 competitor）
currency: CNY                    # 站点币种（写入各 section 的 currency；缺省 CNY，国际站填 USD）

# ---------- 1.1) 渲染模式（站点级默认；各 section 未指定时继承；Hybrid 站点见下方 per-section render）----------
# 取值：ssr（纯 Node fetch 静态 HTML，最快）/ browser（Playwright 真浏览器取执行后 DOM）/ auto（先 ssr，
#       内容 <800 字符自动升级 browser，缺省兜底最稳）。spa 已于 2026-10-05 更名 browser（不保留别名）。
#   render       : 站点级统一模式（多规则站点最常写）
#   renderList   : 仅列表页（覆盖本栏目/站点 render）
#   renderDetail : 仅详情页（覆盖本栏目/站点 render）
#   回退链：列表 = renderList → render → 顶层 render → auto；详情 = renderDetail → render → 顶层 render → auto
# render: auto
# renderList: ssr
# renderDetail: browser

# ---------- 1.2) 代理（按需用，默认直连）----------
# 什么时候需要：开了 VPN 后境外站（BioLegend / 义翘 / MCE / elabscience.com 等）仍被 WAF 拦时才加；
#   国内站不要加（绕出国会变慢且更易被拦）。Chromium 不认 http_proxy 环境变量，必须显式配。
# 写法二选一：写完整 URL，或 '${CRAWL_PROXY}'（端口只在 .env 维护一处）。
# 生效优先级（高→低）：section.proxy > section.antiBot.proxy > 顶层 proxy > 顶层 antiBot.proxy > CRAWL_PROXY 环境变量。
# proxy: '${CRAWL_PROXY}'

# ---------- 1.3) 反爬/指纹（绝大多数站无需配，引擎默认值即可）----------
# 引擎默认：mid 档 stealth + 时区 Asia/Shanghai + 语言 zh-CN + 1920×1080 + 有头最大化。
# 只有个别站需特调（境外代理需改时区/语言、CI 需无头）才写下面这个块；字段全部可选，省略即引擎默认。
# antiBot:
#   profile: mid                 # none=调试裸浏览器 / low / mid(默认) / high=加 Canvas/WebGL 噪声
#   timezone: Asia/Shanghai      # 用境外代理时应与 IP 属地一致
#   locale: zh-CN                # 同时决定 Accept-Language
#   maximize: true              # 有头时窗口最大化铺满（默认 true；固定小视口调试设 false）
#   headless: false             # 无头开关（默认 false=有头；CI/服务器设 true）
#   seed: 12345                 # Canvas/WebGL 噪声种子（同站固定，回访指纹稳定）
#   proxy: '${CRAWL_PROXY}'     # 也可写在这里（等价于顶层 proxy）

# ---------- 1.4) 分类归属（各 section 未指定时继承；三种来源按优先级取一）----------
# 优先级：categoryFromPage（动态，最准）> categoryPath（静态数组）> category（单名兜底）；都省略→不绑分类。
#   · 注意：categoryFromPage / categoryPath / category 都「先查 section、再查顶层」——
#      section 配了就用 section 的，没配才回退顶层（见「附 A」）。
#
# a) categoryFromPage —— 面包屑动态分类（推荐）：从详情页 HTML 抽「根→叶」路径，爬取时自动建树。
# categoryFromPage:
#   itemSelector: ".breadcrumb li"   # 面包屑条目选择器（按文档顺序依次取文本）
#   strip: ["首页", "产品分类"]       # 可选：剔除无意义段
#   keepLast: true                   # 可选：保留末段（默认 false——末段通常是产品名本身）
#   maxDepth: 4                      # 可选：路径最大深度（默认 4）
#
# b) categoryPath —— 静态面包屑路径（整站分类固定时直接写死，根→叶）
# categoryPath: ["试剂", "抗体", "一抗"]
#
# c) category —— 单名兜底（等价单层 categoryPath）
# category: 抗体

# ---------- 2) 顶层公共默认值（各 section 未指定时继承；可整段省略）----------
listTraversal:
  strategy: pagination-html      # 默认翻页策略
  nextSelector: "a.next"         # 翻页按钮 CSS 选择器（pagination-* 类必填；pagination-url 不需要）
  maxPages: 50                   # 最大翻页数（防呆上限；默认 1000。实际终止主要靠「本页解析 0 条」；CLI --pages 与本值取小）
  fallbackToUi: true             # 接口/模型模式失败自动回退 UI 驱动（默认 true；pagination-url 不使用）
  # —— pagination-url 专用字段（其余策略留空即可）——
  # urlTemplate: "?page={page}"  # 含 {page} 占位；完整 URL / 绝对路径 / 查询串后缀三种写法（见 loader.ts 注释）
  # pageStart: 1                 # 起始页码（默认 1；部分站点从 0 / 2 起算；仅 pagination-url）
  # pageEnd: 500                 # 终止页码（闭区间；与 maxPages 取更近者；仅 pagination-url）
  # —— 条目级截取（所有翻页策略生效；CLI --offset / --per-page 可临时覆盖）——
  # offset: 0                    # 每页条目起始偏移（0 起）：跳过每页前 N 条
  # limit: 20                    # 每页最多取条数：offset 之后连取 limit 条（注意与 CLI --limit 详情总数上限不同）
  # —— 规模化护栏 ——
  # splitThreshold: 5000         # 拆分类阈值（顶层/section 均可配）：单入口条数超此值提示按分类/筛选拆多个 startUrls（默认 5000，0=关闭）
  # waitSelector: ".product-card"  # 仅 browser 通道：goto 后先等该选择器「可见」再 settle（接口渲染晚于 networkidle 时必配；
  #                              #   用「内容级」选择器，浅层容器重挂载时会被清空）
  # listRetry: 1                 # 仅 pagination-url：单页抓取失败重试次数（默认 1；0=不重试；规模化防丢页）

# 顶层默认「列表规则」：结构相同的栏目可不必各自重复写
parseList:
  itemSelector: ".product-item"  # 必填：每个产品条目「容器」的选择器
  fields:
    detailUrl: { sel: "a", attr: href }       # 必填（列表抽出，身份键之一）：条目里指向详情页的链接
    name:      { sel: "h3", text: true }       # 建议填：列表阶段就能拿到名称，便于样本核对
    # —— 列表页也能顺手抽更多字段（可选，写法同 parseDetail；与详情取并集入库，见「附 A」）——
    # sku:     { sel: ".sku", text: true, regex: 'SKU[:：]\s*([\w-]+)' }
    # price:   { sel: ".price", text: true, number: true }   # 列表价常是展示价，详情价才是真实口径
    # cover:   { sel: "img", attr: "data-src" }              # 非内置字段→进 row 兜底列

# 顶层默认「详情规则」：多数栏目共用一套详情模板时写这里
parseDetail:
  captureRest: true              # ★ 未声明的字段全量进 row 兜底（务必保留，零数据丢失；缺省 true）
  fields:
    name:      { sel: ".pd-name", text: true }
    cover:     { sel: "img.cover", attr: src }          # 非内置字段→row
    cloneNumber: { sel: ".title", text: true, regex: '克隆号[:：]\s*([\w-]+)' }
    inStock:   { sel: ".stock", text: true, bool: true } # 「现货/有货/true/1」→true；「缺货/下架/false/0」→false；表外→null
    applications: { sel: ".app-list li", list: true }    # 应用方向数组
    specs:
      sel: ".spec-row"
      list: true
      map:
        spec:          { sel: ".spec", text: true }
        condition:     { sel: ".cond", text: true }       # 规格尾缀（常温/冻存）等，无则省略
        sku:           { sel: ".sku", text: true }        # 形态C 才需要；单货号产品省略此行
        priceNow:      { sel: ".price-now", text: true, regex: '[\d\.]+', number: true } # ★ 价格必加 number:true
        priceOriginal: { sel: ".price-origin", text: true, regex: '[\d\.]+', number: true }
        priceActivity: { sel: ".price-act", text: true }
        pricePromo:    { sel: ".price-promo", text: true }
    introMedia:
      sel: ".intro-block"
      list: true
      map:
        image:       { sel: "img", attr: src }
        video:       { sel: "iframe", attr: src }   # 有介绍视频（iframe 播放器）才输出
        description: { sel: ".intro-desc", text: true }
  # —— 形态 D（异步接口，默认注释掉）与形态 E（模型兜底，默认注释掉）也可作为顶层默认值 ——
  # api:
  #   - target: specs
  #     url: "https://example.com/api/goods/{sku}/skus"
  #     method: GET
  #     headers: { Referer: "https://example.com/" }
  #     rootPath: "data.list"
  #     pick: { spec: "specName", priceNow: "price", priceOriginal: "marketPrice" }
  # modelFallback: true          # 简写，等价于 { enabled: true }；只补空、不覆盖静态结果

# ---------- 3) 栏目列表（本文件核心）----------
sections:

  # ==========================================================================
  # 栏目 1：全量覆盖 —— 自带列表页、命中条件、翻页策略与列表/详情规则
  # ==========================================================================
  - key: all-products                       # 栏目标识：写入 ListItem.sectionKey 与 products.section_key
    name: 全部产品                          # 可选展示名（写入 sections.name；缺省回退 key）
    productLine: 细胞试剂                     # 产品线（可选）：写入 sections.product_line；crawl --product-line 可据此过滤
    # render: ssr                            # 可选：本栏目统一渲染模式（覆盖顶层 render）
    # renderList: ssr                        # 可选：仅列表页（覆盖 render）；如产品列表是 SSR
    # renderDetail: browser                  # 可选：仅详情页（覆盖 render）；如详情是 CSR、列表已 SSR
    # antiBot:                               # 可选：本栏目反爬/指纹（整体覆盖顶层 antiBot，非字段级深合并）
    #   profile: high
    # proxy: '${CRAWL_PROXY}'               # 可选：本栏目单独代理（覆盖顶层 proxy / antiBot.proxy）
    startUrls:                              # 该栏目的列表页入口（可多个；省略则回退顶层 startUrl）
      - "https://example.com/products"
      - "https://example.com/products/page2"
    match:                                  # URL 命中判定（可选；供 crawl 在「未打 key」时反查所属栏目）
      listUrlIncludes:                      # 列表 URL 含任一子串即属于本栏目
        - "/products"
        - "/all-products"
      detailUrlIncludes:                    # 详情 URL 含任一子串即属于本栏目
        - "/product/"
    listTraversal:                          # 覆盖顶层：本栏目翻页按钮不同
      strategy: pagination-html
      nextSelector: "a.pager-next"
      maxPages: 100
      fallbackToUi: true
      # ⚠️ 若本栏目需 waitSelector / listRetry / splitThreshold，必须在此**显式重抄**（合并函数不继承这三个字段，
      # 详见「附 B」）；顶层写了而这些字段对本栏目也适用时同理。
    parseList:                              # 覆盖顶层：列表条目结构不同
      itemSelector: ".all-products .card"
      fields:
        detailUrl: { sel: "a.card-link", attr: href }
        name:      { sel: ".card-title", text: true }
        sku:       { sel: ".card-sku", text: true, regex: 'SKU[:：]\s*([\w-]+)' }
    parseDetail:                            # 覆盖顶层：详情页是另一套模板
      fields:
        name:      { sel: "h1.pd-title", text: true }
        cloneNumber: { sel: ".pd-meta .clone", text: true }
        applications: { sel: ".applications a", list: true }
        specs:
          sel: "table.spec tr"
          list: true
          map:
            spec:     { sel: "td:nth-child(1)", text: true }
            priceNow: { sel: "td:nth-child(2)", text: true, regex: '[\d,]+\.?\d*', number: true }
        introMedia:
          sel: ".pd-gallery figure"
          list: true
          map:
            image:       { sel: "img", attr: "data-src" }
            description: { sel: "figcaption", text: true }
      captureRest: true
      # 形态 D：本栏目规格由 XHR 返回、静态 HTML 无 → 启用 api（默认注释，probe 告警后人工回填）
      # api:
      #   - target: specs
      #     url: "https://example.com/api/goods/{sku}/skus"
      #     rootPath: "data"
      #     pick: { spec: "specName", priceNow: "price" }

  # ==========================================================================
  # 栏目 2：部分覆盖 —— 只改列表规则 + 命中条件，详情/翻页继承顶层默认值
  #           （适合「促销专区」：列表卡片不同，但点进去是同一套详情模板）
  # ==========================================================================
  - key: promo
    startUrls:
      - "https://example.com/promo"
    match:
      listUrlIncludes: ["/promo"]
      detailUrlIncludes: ["/product/"]
    # listTraversal 省略 → 继承顶层（strategy: pagination-html, a.next, 50 页…）
    parseList:
      itemSelector: ".promo-grid .promo-tile"
      fields:
        detailUrl: { sel: "a", attr: href }
        name:      { sel: ".promo-name", text: true }
        # 促销价也顺手记下（会随 row 兜底落库）
        pricePromo: { sel: ".promo-price", text: true, regex: '[\d,]+\.?\d*', number: true }
    # parseDetail 省略 → 继承顶层 parseDetail（同一套详情模板）

  # ==========================================================================
  # 栏目 3：极简继承 —— 只有 key + startUrls，其余全部继承顶层
  #           （适合「新品」：列表页结构恰好与顶层默认一致，只是入口不同）
  # ==========================================================================
  - key: new-arrivals
    startUrls:
      - "https://example.com/new"
    # listTraversal / parseList / parseDetail 全部省略 → 完全继承顶层默认值

  # ==========================================================================
  # 栏目 4：纯模型兜底栏目 —— 结构不稳定、交给 model-generic
  # ==========================================================================
  - key: misc
    startUrls:
      - "https://example.com/others"
    listTraversal:
      strategy: model-generic
      fallbackToUi: true
    parseList:
      itemSelector: "article"
      fields:
        detailUrl: { sel: "a", attr: href }
        name:      { sel: "h2", text: true }
    # parseDetail 省略 → 继承顶层

  # ==========================================================================
  # 栏目 5：资讯栏目（contentType: news）—— 产品 + 资讯混排的示例
  # --------------------------------------------------------------------------
  # · contentType: news → 抓取结果落 contents 表（不进 products，不参与比价）；
  # · type 就写你想要的内容类型：news=新闻 / announcement=公告 / event=活动 / document=文档…
  #   网页「资讯动态」页按该 type 分组展示；
  # · 内容栏目同样参与分类建树（category / categoryFromPage / categoryPath 生效）；
  # · 字段映射见文件头「采集类型路由」与「附 C」：列表阶段抽 name + detailUrl 最省事，
  #   详情阶段可选抽 summary / body / date / author / bodyHtml。
  # ==========================================================================
  - key: news
    contentType: news                           # ★ 关键：声明本栏目是资讯采集（缺省 products）
    startUrls:
      - "https://example.com/news"
    match:
      listUrlIncludes: ["/news"]
      detailUrlIncludes: ["/news/"]
    listTraversal:
      strategy: pagination-url               # 资讯列表多是 SSR 翻页，URL 模板最快最稳
      urlTemplate: "?page={page}"
      maxPages: 10
    parseList:
      itemSelector: ".news-list li"
      fields:
        detailUrl: { sel: "a", attr: href }  # 必填：原文链接（去重键兜底）
        name:      { sel: "a", text: true }   # 标题（映射到 contents.title）
        date:      { sel: ".news-date", text: true }   # 可选：列表页顺手抽日期（自动转 Unix 秒）
    parseDetail:
      fields:
        name:     { sel: "h1.article-title", text: true }   # 标题（详情优先，列表兜底）
        summary:  { sel: ".article-summary", text: true }   # 摘要（或 description 也可）
        body:     { sel: ".article-body", text: true }      # 正文（或 content / text 亦可）
        author:   { sel: ".article-source", text: true }    # 作者/来源（或 source 亦可）
        date:     { sel: ".article-date", text: true }      # 发布时间（YYYY-MM-DD 等常见写法均可，自动转 Unix 秒）
        bodyHtml: { sel: "section.article", html: true }    # 可选富文本（innerHTML，仅此写法才抽）
      captureRest: true

  # ==========================================================================
  # 栏目 6：公告栏目（contentType: announcement）—— 第二种内容类型，同表不同 type
  # ==========================================================================
  - key: announcements
    contentType: announcement
    startUrls:
      - "https://example.com/about/notice"
    parseList:
      itemSelector: ".notice-list li"
      fields:
        detailUrl: { sel: "a", attr: href }
        name:      { sel: "a", text: true }
        date:      { sel: ".notice-date", text: true }
    parseDetail:
      fields:
        name:    { sel: "h1", text: true }
        body:    { sel: ".notice-body", text: true }
      captureRest: true

  # ==========================================================================
  # 栏目 7：仅列表采集（listOnly）—— 内容无详情页，列表快照即终态
  # --------------------------------------------------------------------------
  # · listOnly: true → 跳过详情阶段，列表抽到的 title(=name) + detailUrl + row 直接落 contents 表；
  # · 适用于「文件下载直链 / 前端渲染单页数据」这类没有详情页可抓的内容；
  # · 产品管线（products）不支持 listOnly（价格/规格必须有详情阶段）。
  # · 默认单页遍历（继承站点级翻页会被「全量返回」误判触发疯狂翻页，引擎已用 LIST_ONLY_TRAVERSAL 兜住）；
  #   确实要翻页的栏目（如下载列表是分页的）显式写 listTraversal 覆盖即可（本例即显式 pagination-url）。
  # ==========================================================================
  - key: downloads
    contentType: document               # 落到 contents 表，type=document
    listOnly: true                      # ★ 关键：仅列表模式
    startUrls:
      - "https://example.com/downloads"
    listTraversal:
      strategy: pagination-url
      urlTemplate: "?page={page}"
      maxPages: 10
    parseList:
      itemSelector: ".file-list li"
      fields:
        detailUrl: { sel: "a", attr: href }   # 文件直链（落 contents.detail_url）
        name:      { sel: "a", text: true }   # 文件名（映射到 contents.title）
        date:      { sel: ".file-date", text: true }
    # 注意：listOnly 站点不写 parseDetail（写了也无效）

  # ==========================================================================
  # 栏目 8：Hybrid 渲染 + 反爬/代理/分类 局部覆盖示例
  # --------------------------------------------------------------------------
  # 演示 section 级能单独覆盖的每一项（对照「附 A」优先级表）：
  #   · renderList=ssr（列表 SSR 快）、renderDetail=browser（详情 CSR 需真浏览器）
  #   · antiBot 整体覆盖（高伪装 + 境外代理时区）
  #   · categoryFromPage 动态分类（覆盖顶层静态 categoryPath）
  # ==========================================================================
  - key: hybrid-zone
    startUrls:
      - "https://example.com/zone"
    renderList: ssr
    renderDetail: browser
    antiBot:
      profile: high
      timezone: "America/New_York"      # 走境外代理时与 IP 属地一致
      locale: "en-US"
    proxy: '${CRAWL_PROXY}'
    categoryFromPage:                   # 覆盖顶层 categoryPath：详情页动态面包屑建树
      itemSelector: ".crumb li"
      strip: ["Home", "Products"]
      keepLast: false
    parseList:
      itemSelector: ".zone-item"
      fields:
        detailUrl: { sel: "a", attr: href }
        name:      { sel: ".zone-name", text: true }
    # parseDetail 省略 → 继承顶层

# ============================================================================
# 附 A：继承 / 优先级表（code: loader.ts resolveSections / mergeTraversal）
# ----------------------------------------------------------------------------
# 每个 section 的最终生效值 = 「section 显式值」优先，未写则回退「顶层默认值」，再未写则代码内置默认。
#
# | 配置项            | section 写法                  | 回退到顶层                | 内置默认                       |
# |-------------------|-------------------------------|---------------------------|--------------------------------|
# | parseList         | section.parseList             | cfg.parseList             | （二者皆无 → 抛错，必须有一个） |
# | parseDetail       | section.parseDetail           | cfg.parseDetail           | { fields:{}, captureRest:true } |
# | listTraversal     | section.listTraversal        | cfg.listTraversal        | { pagination-html, 1000, true } |
# |   └ 单页覆盖      | 显式 strategy: none           | —                         | —（只抓第一页）                |
# | startUrls         | section.startUrls(非空)       | [cfg.startUrl]            | []（无入口则跳过该栏目）        |
# | contentType       | section.contentType/collects  | cfg.contentType/collects  | 'products'                     |
# | category/catPath  | section.category/categoryPath| cfg.category/categoryPath | section.category 单层级 > cfg.category 单层级 |
# | categoryFromPage  | section.categoryFromPage     | cfg.categoryFromPage      | 不绑                           |
# | productLine       | section.productLine           | cfg.productLine           | 不绑                           |
# | brand             | section.brand                 | cfg.brand                 | 不绑                           |
# | render            | section.render                | cfg.render                | auto                           |
# | renderList        | section.renderList            | cfg.renderList            | 回退 render → auto             |
# | renderDetail      | section.renderDetail          | cfg.renderDetail          | 回退 render → auto             |
# | antiBot           | section.antiBot（整体覆盖）   | cfg.antiBot               | 引擎默认(mid/上海/zh-CN/有头)   |
# | proxy             | section.proxy > section.antiBot.proxy | cfg.proxy > cfg.antiBot.proxy | CRAWL_PROXY 环境变量 → 直连 |
#
# ⚠️ listTraversal 是「字段级合并」：section 只写 maxPages，strategy/nextSelector/…/limit 继承顶层。
#    但 waitSelector / listRetry / splitThreshold 三个字段**不参与合并**（见「附 B」）。
# ============================================================================

# ============================================================================
# 附 B：listTraversal 合并的已知边界（重要）
# ----------------------------------------------------------------------------
# mergeTraversal 只合并这 9 个字段：strategy / nextSelector / maxPages / fallbackToUi /
# urlTemplate / pageStart / pageEnd / offset / limit。
# 它**不会**从顶层继承这 3 个字段：waitSelector / listRetry / splitThreshold。
#
# 后果：若某 section 显式写了 listTraversal（哪怕只覆盖 maxPages），而该栏目又需要 waitSelector，
# 则**必须在本 section 的 listTraversal 里重新写上 waitSelector**（顶层那个对它是失效的）。
# 否则栏目会静默丢掉 waitSelector → 接口渲染晚于 networkidle 时抓到空壳。
#
# listOnly 栏目的兜底：若 listOnly 且 section 未写 listTraversal → 引擎用 LIST_ONLY_TRAVERSAL
# （{ strategy: pagination-html }，无 nextSelector → 只取第一页），防止「全量返回」栏目被翻到上限。
# 显式写了 listTraversal 则按显式为准。
# ============================================================================

# ============================================================================
# 附 C：内容栏目字段映射（toPendingContent，code: crawl.ts）
# ----------------------------------------------------------------------------
# YAML 里推荐的写法与落库列：
#   name          → contents.title        （标题链：np.name → row.title → 列表名 → 列表 raw.title；无标题则丢弃）
#   summary       → contents.summary      （兜底可写 description）
#   body          → contents.body         （兜底可写 content / text）
#   bodyHtml      → contents.body_html    （仅 YAML 显式配 html:true 才抽；缺省恒 null，不占空间）
#   author        → contents.author       （兜底可写 source）
#   date          → contents.published_at （兜底可写 publishedAt / publishTime / publishDate / time；统一转 Unix 秒）
#   detailUrl     → contents.detail_url   （必填，身份键之一）
#   sourceId      → contents.source_id    （身份键之一；也可写 articleId / newsId；仅列表抽到的兜底进 source_id）
#   listUrl       → contents.list_url     （溯源，引擎自动填）
#   其它字段名     → contents.row JSON     （站点特有字段，不参与去重/比价）
#
# 两阶段并集（与产品管线同语义）：详情字段优先；列表阶段独有的字段补进 row；
# 两阶段同名的字段 → 详情值为准，列表值存 row._<key> 保真。
# 去重键 = COALESCE(source_id, canonical(detail_url))，软删口径与产品一致（连续 2 轮缺失下架）。
# ============================================================================

# ============================================================================
# 附 D：内置字段速查（写这些名会被归一化到 products / contents 对应列；其余一律进 row 兜底）
# ----------------------------------------------------------------------------
# 【products 管线】16 个非站点级内置字段：
#   身份：name* / sourceProductId* / sku / englishName / aliases / oldSkus / brand / detailUrl*
#   可比：price / priceText / specText
#   描述：description
#   其它：cloneNumber / specs / introMedia / applications
#   （* 为必填或身份键：name 与 detailUrl 是列表/详情必填与身份键，sourceProductId 为详情身份键二选一）
#   站点级（非解析字段，写 YAML 顶层，不进 fields）：currency。
# 【contents 管线】9 个内置字段：title*(←name) / summary / body / bodyHtml / author / publishedAt /
#   detailUrl* / sourceId* / listUrl（* 为必填/身份键；contentType!=products 时 name 等价于 title）。
# ⚠️ sourceProductId 只装「站点自身产品 id」，没有就留空（绝不用货号兜底）。
# ⚠️ sku = 默认规格货号（形态 C 每规格一个货号时全量在 specs[].sku，sku 列存默认规格）；
#    price / specText 同理 = 默认规格的现价/规格文本快照（比价、涨跌、历史的统一口径）。
# ⚠️ 示例里的 specsAlt / specsInline / meta / variants / groups 不是内置名 → 会进 row（示例用；要用作规格列表请改名为 specs）。
# ============================================================================

# ============================================================================
# 附 E：FieldSpec 速查（复制即用）
# ----------------------------------------------------------------------------
#   纯文本        → { sel: "x", text: true }
#   属性值        → { sel: "x", attr: "href" }
#   文本抽一段    → { sel: "x", text: true, regex: '(\d+)' }
#   属性抽一段    → { sel: "x", attr: "href", regex: '/p/(\d+)' }
#   富文本        → { sel: "x", html: true }         （取 innerHTML，保留标签；仅 bodyHtml 等富文本字段用）
#   转数值        → 上面任一 + number: true           （去千分位/币符；失败 null）
#   转布尔        → 上面任一 + bool: true             （现货/有货/true/1→true；缺货/下架/false/0→false；表外→null）
#   读元素自身    → { sel: "$self", attr: "data-price" }  （★ $self 是 sel 的特殊值，非取值方式）
#   内联 JSON     → 上面任一 + json: true [+ jsonPath] [+ pick]
#   固定值        → { const: 值 }                      （不走 DOM，直接落值；不需要 sel；含前导零须加引号）
#   多值数组      → 上面任一 + list: true
#   单一子对象    → 上面任一 + map: { key: <FieldSpec> }
#   子对象数组    → list: true + map: { key: <FieldSpec> }
#   任意深度嵌套  → map 内再写 map
#   异步接口      → parseDetail.api: [{ target, url, rootPath, pick }]（见模板 A「六」）
#   模型兜底      → parseDetail.modelFallback: true（形态 E；读可见文本，只补空；见模板 A「七」）
# ============================================================================

# ============================================================================
# 附 F：配置校验（pnpm validate，不阻断只给 issue；error 级退出码 1 供 CI）
# ----------------------------------------------------------------------------
#   INVALID_RENDER_MODE        render/renderList/renderDetail（含 section 级）取值非法；旧名 spa 提示改 browser
#   MISSING_REQUIRED           栏目缺必填字段（products: name；contents: 经 name→title 满足）
#   MISSING_IDENTITY           products 既无 parseList.detailUrl 也无 parseDetail.sourceProductId
#   HASH_PAGINATION_UNSUPPORTED  pagination-url 的 urlTemplate 含 '#'（HTTP 不发送 fragment）
#   STAGE_MISMATCH             站点级字段（currency）误放进 fields / 详情专属字段只配在列表
#   NUMERIC_NOT_NUMBER         price 等**数值字段**（价格类）未标 number: true；publishedAt 是日期字符串，不要求 number: true
#   UNKNOWN_FIELD_TYPO         字段名拼写极近内建（编辑距离≤1）才告警，否则视为合法站点特有字段静默放行
# ============================================================================

# ============================================================================
# 附 G：下一步命令
# ----------------------------------------------------------------------------
#   pnpm probe --domain example.com                 # 逐栏目验证 + 自动判定规格价格形态（默认抽查 1 个详情页）
#   pnpm probe --domain example.com --section promo # 只验证某个栏目
#   pnpm probe --domain example.com --section promo --list-url https://example.com/promo?page=2
#   pnpm crawl --site example.com --dry-run --limit 3        # crawl 默认 --source config（YAML 即爬取范围）
#   pnpm crawl --site example.com,other.com --dry-run --limit 3
#   pnpm crawl --dry-run --limit 3                           # 不带 --site = 全量（config 目录所有 YAML）
#   pnpm validate                                         # 校验全部站点配置（error 退出码 1，不阻断）
# ============================================================================
