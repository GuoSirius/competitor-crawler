# 站点适配器：海狸（Beaver）www.beaverbio.com
# 结构（2026-10 实测复核）：
#   - 产品中心下拉共 12 个一级分类，每类一个列表页 /products/index/<id>.html
#   - 列表页 div.grid-inner 产品卡：div.portfolio-image a(详情 /products/list/<id>.html) + img[alt](产品名)
#   - 翻页：真实 URL ?page=N（实测最多 3 页）→ pagination-url
#   - 详情页：h1=产品名；价格在无类名 td（¥xxxx），body regex 兜底
# 站点为静态模板，12 个分类共用同一套列表/详情解析规则（顶层定义，栏目继承）。
domain: www.beaverbio.com
company: "苏州海狸生物医学工程有限公司"
companyShort: "Beaver 海狸"
currency: CNY
startUrl: "https://www.beaverbio.com/products/index/1092.html"

listTraversal:
  strategy: pagination-url
  urlTemplate: "?page={page}"
  pageStart: 1
  maxPages: 10
  fallbackToUi: false

parseList:
  itemSelector: "div.grid-inner"
  fields:
    detailUrl: { sel: "div.portfolio-image a", attr: href }
    name:      { sel: "img", attr: alt }

parseDetail:
  fields:
    name:      { sel: "h1", text: true }
    priceText: { sel: "body", text: true, regex: '¥\s*([\d,]+\.?\d*)' }
  captureRest: true

sections:
