# 站点适配器：同仁化学（www.dojindo.cn，Nuxt 2 SPA + POST 接口）
# 结构（2026-10-09 与用户一起复核，纠正「接口形态 E / 无详情链」误判）：
#   - 列表页 /products/category/<一级id>?c2id=<二级id>：Nuxt 客户端渲染成标准表格
#     table.table tbody tr（品名/货号/用途三列）；数据来自
#     POST /api/product/product_list（form-urlencoded，body category_id=<二级id>）——
#     GET 请求或传一级分类 id 均返空，这是早年「接口返空」误判的根因；
#   - 行内无 <a> 详情链：详情跳转是 @click 事件（goProductDetail），JS 里
#     "/products/".concat(encodeURIComponent(model))（chunk 5be7882 module 62），
#     详情 URL = /products/<货号>（如 /products/C557）——由代码适配器
#     packages/crawler/src/adapters/www.dojindo.cn.ts 的 postParseList 用货号拼出；
#   - 一级分类页只渲染首个二级 tab，?c2id=<二级id> 可指定 tab（组件 created 里
#     c = $route.query.c2id || data.category[0].id），114 个二级 tab 全量展开成 startUrls；
#   - 「促销产品」（一级 120）无二级 tab，列表恒空，不入 startUrls；
#   - 详情页渲染后字段：span.goods_title / span.lan(货号：X) / span.pric(¥xx) /
#     div.zjid div.langseas(选中规格) / div.goods_list(储存/运输条件) / div.htmlsss(富文本)
# 抓取命令：pnpm crawl --domain www.dojindo.cn
domain: www.dojindo.cn
company: "同仁化学研究所（Dojindo Laboratories）"
companyShort: "同仁化学"
currency: CNY
render: browser # Nuxt 客户端渲染，必须浏览器通道
listTraversal:
  strategy: none # product_list 每个二级 tab 一次拉全量，无翻页

