parseList:
  itemSelector: 'table.table tbody tr'
  fields:
    name:
      sel: 'td:nth-child(1) span.xiahuanxa'
      text: true
    sourceProductId:
      sel: 'td:nth-child(2) span.xiahuanxa'
      text: true
    use:
      sel: 'td:nth-child(3)'
      text: true
# detailUrl 不配：行内无 <a>，由 www.dojindo.cn.ts 的 postParseList 拼出

parseDetail:
  fields:
    name: { sel: 'span.goods_title', text: true }
    # 身份键：详情页货号行（与列表阶段抽的 model 同源；validate 要求显式身份键）
    sourceProductId:
      sel: 'span.lan'
      text: true
      regex: '货号：(.+)'
    englishName: { sel: 'div.goods_intro', text: true }
    sku:
      sel: 'span.lan'
      text: true
      regex: '货号：(.+)'
    price:
      sel: 'span.pric'
      text: true
      regex: '([\d,]+\.?\d*)'
      number: true
    priceText: { sel: 'span.pric', text: true }
    specText: { sel: 'div.zjid div.langseas', text: true }
    storage:
      sel: 'div.goods_list div.goods_li:nth-child(1)'
      text: true
      regex: '储存条件：(.*)'
    transport:
      sel: 'div.goods_list div.goods_li:nth-child(2)'
      text: true
      regex: '运输条件：(.*)'
    description: { sel: 'div.htmlsss', text: true }
  captureRest: true

categoryFromPage:
  # 详情页面包屑 div.arrow：首页 > 产品中心 > <一级分类> > <产品名>（span.topc）
  # keepLast: false 丢弃产品名，挂一级分类
  itemSelector: 'div.arrow span'
  strip:
    - 首页
    - 产品中心
  keepLast: false
