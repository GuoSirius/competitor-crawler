domain: www.procell.com.cn
company: 普诺赛中文站
role: own
currency: 元
render: auto
startUrl: https://www.procell.com.cn/search

# URL 模板翻页：/search?page=N（SSR 站最快最稳；解析 0 条自动停）
listTraversal:
  strategy: pagination-url
  urlTemplate: "?page={page}"
  pageStart: 1
  maxPages: 10000
  fallbackToUi: true

# 面包屑动态分类：详情页 .breadcrumb = 当前位置/首页/血清 → 爬取时自动建分类树
categoryFromPage:
  itemSelector: ".breadcrumb li"
  strip: ["当前位置", "首页"]
  keepLast: true # 末段「血清」是分类名，须保留

parseList:
  itemSelector: .searchs-list-content
  fields:
    detailUrl:
      sel: '.s-list-div:nth-child(1) a'
      attr: href
    # data-title 是干净中文名（不带货号括注）
    name:
      sel: '.s-list-div:nth-child(1) a'
      attr: data-title
    # 货号在名称文本的全角括号里：特级胎牛血清（164210）
    sku:
      sel: '.s-list-div:nth-child(1) a'
      text: true
      regex: '（([A-Za-z0-9-]+)）'
    specText:
      sel: '.s-list-div:nth-child(2) p:contains(规格)'
      text: true
      regex: '规格：\s*(.*)'
    priceText:
      sel: '.s-list-div:nth-child(2) p:contains(价格)'
      text: true
      regex: '价格：\s*(.*)'

parseDetail:
  captureRest: true
  fields:
    # 中文名：产品页 h1（.detail-table 是「产品特性/储存条件/运输条件」表，别用行号定位）
    name:
      sel: 'h1.js-p-title'
      text: true
    englishName:
      sel: '.js-en-title'
      text: true
    sku:
      sel: '.js-huohao'
      text: true
    # 曾用货号（分号拼接串，含现用）；按 label 文本定位，比行号稳
    oldSkus:
      sel: '.produc-canshu p:contains(曾用货号) span:nth-child(2)'
      text: true
    # 别称（细胞系等页面 .detail-table 有此行，分号拼接；血清类无此行 → null）
    aliases:
      sel: 'tr:contains(别称) td.d-content'
      text: true
    # 种属（无独立列 → 进 row 兜底）
    种属:
      sel: 'tr:contains(种属) td.d-content'
      text: true
    # 默认规格快照：price/specText 不会自动从 specs[0] 推导，必须显式声明（tr:not([class]) 跳过表头行）
    # specText 与 specs[].spec 同口径：同样剥离结尾括注
    specText:
      sel: '.produc-canshu table tr:not([class]) .size_span'
      text: true
      regex: '^(.*?)\s*(?:[（(][^）)]*[）)])?\s*$'
    price:
      sel: '.produc-canshu table tr:not([class]) .price_span'
      text: true
      number: true
    priceText:
      sel: '.produc-canshu table tr:not([class]) .price_span'
      text: true
    specs:
      sel: '.produc-canshu table tr:not([class])'
      list: true
      map:
        spec:
          sel: '.size_span'
          text: true
          # 剥离结尾的（常温）/(冻存) 等括注 → 干净规格名；无括注时整段保留
          regex: '^(.*?)\s*(?:[（(][^）)]*[）)])?\s*$'
        # 括注单独存（如「常温」），与 spec 成对；无括注为 null
        condition:
          sel: '.size_span'
          text: true
          regex: '[（(]([^）)]+)[）)]'
        priceNow:
          sel: '.price_span'
          text: true
          number: true
    introMedia:
      sel: '#carouseldetail .carousel-inner .carousel-item'
      list: true
      map:
        image:
          sel: img
          attr: src
        # 视频项 = B 站播放器 iframe（纯图片项为 null）；Web 展示侧按 video 渲染
        video:
          sel: 'iframe'
          attr: src
        description:
          sel: img
          attr: data-title
