name: CI

# 与本地 pre-commit 门禁等价的第二道保险：
# 本地钩子可能被 --no-verify 绕过、也可能在没装 husky 的机器上失效，CI 保证远端始终校验。

on:
  push:
  pull_request:

# 同一分支连续推送时取消上一次未跑完的任务，省额度、少排队。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本与本地一致（pnpm 12.5.1 / lockfileVersion 9.0）。
      # 若想改成以 package.json 的 packageManager 字段为准，可去掉 version 并补上该字段。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 严格按 lockfile 安装，lockfile 与 package.json 不一致时直接失败（防止依赖漂移）。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm typecheck` = `node scripts/typecheck.mjs`，依次跑 shared → crawler → web（见 docs/12 §12.9）。
      # web 那一步是**自适应**的：装了 vue-tsc 就检查，没装就跳过并提示（本地/CI 同一份逻辑）。
      - name: Typecheck (shared + crawler + web)
        run: pnpm typecheck

      # ESLint（docs/16 M1）：typescript-eslint recommended 基线，规则口径见 eslint.config.mjs
      - name: Lint
        run: pnpm lint

      # commitlint（docs/16 M2）：与本地 commit-msg 门禁（scripts/commitmsg.mjs）同口径。
      # push 校验最新一条提交；PR 校验 base..head 区间内的全部提交主题。
      - name: Commitlint
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FROM="${{ github.event.pull_request.base.sha }}"
          else
            FROM="HEAD~1"
          fi
          git log --format=%s "$FROM..HEAD" | pnpm exec commitlint

      # 含「环境变量契约」测试：校验 process.env 读取点与 .env.example 声明双向一致。
      - name: Unit tests
        run: pnpm test
