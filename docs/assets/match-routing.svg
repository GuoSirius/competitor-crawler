<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1000" width="1360" height="1000"
     font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <!--
    match（listUrlIncludes / detailUrlIncludes）v2 —— 换一种讲法：
    ① 先说它不是什么 / 与入库的关系（毫无关系）
    ② 再讲主流程正常怎么走（sectionKey 正向路由，不需要它）
    ③ 它什么时候才登场（URL 反查兜底，当前零调用）
    ④ 路由算法（OR 匹配 / 声明序优先 / 无命中 undefined）
    配套：entry-paginate-flow.svg
  -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/>
    </marker>
  </defs>

  <rect width="1360" height="1000" fill="#FFFFFF"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0F172A">match：listUrlIncludes / detailUrlIncludes 是干嘛的</text>
  <text x="40" y="80" font-size="14" fill="#64748B">代码事实源：config/loader.ts pickSectionByUrl · config/types.ts SectionConfig.match · commands/crawl.ts collectSection</text>

  <!-- ① 不是什么 -->
  <text x="40" y="124" font-size="15" font-weight="700" fill="#B91C1C">① 先说它不是什么</text>
  <rect x="40" y="140" width="1280" height="96" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="70" y="170" font-size="14" fill="#334155">❌ 不是抓取入口（抓哪些页面由 startUrl/startUrls 决定，跟它无关）</text>
  <text x="70" y="196" font-size="14" fill="#334155">❌ 不参与数据入库、不参与去重（入库键里根本没有它；正常爬取时它一行代码都不会被执行——生产代码零调用）</text>
  <text x="70" y="222" font-size="14" fill="#334155">❌ 不配也完全不影响正常爬取（它是「可选项里的可选项」，纯预留）</text>

  <!-- ② 主流程 -->
  <text x="40" y="284" font-size="15" font-weight="700" fill="#15803D">② 数据是怎么入库的（主流程，完全不经过 match）</text>

  <rect x="40" y="300" width="290" height="150" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="60" y="328" font-size="13.5" font-weight="700" fill="#15803D">列表阶段</text>
  <text x="60" y="352" font-size="12.5" fill="#334155">抓列表页 → 每个产品条目</text>
  <text x="60" y="372" font-size="12.5" fill="#334155">解析出 detailUrl 时，</text>
  <text x="60" y="392" font-size="12.5" fill="#334155">直接打上本栏目的</text>
  <text x="60" y="412" font-size="13" font-weight="700" fill="#15803D">sectionKey 标签</text>
  <text x="60" y="436" font-size="11.5" fill="#64748B">（谁抓到的就标谁，零猜测）</text>

  <rect x="370" y="300" width="290" height="150" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="390" y="328" font-size="13.5" font-weight="700" fill="#15803D">详情阶段</text>
  <text x="390" y="352" font-size="12.5" fill="#334155">拿到标签后按 sectionKey</text>
  <text x="390" y="372" font-size="12.5" fill="#334155">直接选对应栏目自己的</text>
  <text x="390" y="392" font-size="12.5" fill="#334155">parseDetail 解析规则</text>
  <text x="390" y="424" font-size="11.5" fill="#64748B">（标签对上号就行，无需反查）</text>

  <rect x="700" y="300" width="620" height="150" rx="10" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.5"/>
  <text x="720" y="328" font-size="13.5" font-weight="700" fill="#BE185D">入库</text>
  <text x="720" y="354" font-size="13" fill="#334155">唯一键 = (company_id, identity_key, section_key)</text>
  <text x="720" y="378" font-size="12.5" fill="#64748B">identity_key = COALESCE(source_product_id, canonical(detail_url))</text>
  <text x="720" y="404" font-size="12.5" fill="#64748B">注意：这里的 section_key 就是 ①列表阶段打的那个标签 ——</text>
  <text x="720" y="424" font-size="12.5" fill="#64748B">全程没有 listUrlIncludes 什么事。</text>

  <line x1="330" y1="375" x2="368" y2="375" stroke="#16A34A" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="660" y1="375" x2="698" y2="375" stroke="#16A34A" stroke-width="2" marker-end="url(#ag)"/>

  <!-- ③ 什么时候登场 -->
  <text x="40" y="498" font-size="15" font-weight="700" fill="#B45309">③ 它什么时候才登场（为「手里只有一个裸 URL」的场景预留）</text>
  <rect x="40" y="514" width="1280" height="112" rx="10" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5"/>
  <text x="70" y="544" font-size="13.5" fill="#334155">场景：代码适配器钩子返回了一个新 URL、断点续跑恢复、backfill…… 这时手里有个 URL，但**没有标签**，</text>
  <text x="70" y="568" font-size="13.5" fill="#334155">必须回答「这个 URL 属于哪个栏目」才能选对解析规则 —— <tspan font-weight="700">match 就是这张「URL → 栏目归属」速查表</tspan>。</text>
  <text x="70" y="596" font-size="12.5" fill="#64748B">现状：生产主流程目前零调用（正常爬取用不到），属于「配上不亏、不配不响」的保险配置。</text>

  <!-- ④ 路由算法 -->
  <text x="40" y="672" font-size="15" font-weight="700" fill="#334155">④ 路由算法（pickSectionByUrl）：拿 URL 对着表查</text>

  <rect x="40" y="688" width="620" height="176" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="60" y="716" font-size="13.5" font-weight="700" fill="#1D4ED8">查表规则</text>
  <text x="60" y="742" font-size="12.5" fill="#334155">· 数组内多值 = <tspan font-weight="700">OR</tspan>：URL 包含任一子串（url.includes）即命中</text>
  <text x="60" y="766" font-size="12.5" fill="#334155">· 多个栏目都命中 → <tspan font-weight="700">按 sections 声明顺序取第一个</tspan>（先写的赢）</text>
  <text x="60" y="790" font-size="12.5" fill="#334155">· listUrlIncludes 查列表页归属；detailUrlIncludes 查详情页归属</text>
  <text x="60" y="814" font-size="12.5" fill="#334155">· 无命中 / 没配 match → 返回 undefined，调用方自行兜底</text>
  <text x="60" y="844" font-size="12" fill="#64748B">例：detailUrlIncludes: ['/ab/', 'antibody'] → 含 /ab/ 或含 antibody 都算</text>

  <rect x="700" y="688" width="620" height="176" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="720" y="716" font-size="13.5" font-weight="700" fill="#475569">配置示例（多规则站点）</text>
  <text x="720" y="742" font-size="12" fill="#334155" font-family="Consolas,monospace">sections:</text>
  <text x="720" y="764" font-size="12" fill="#334155" font-family="Consolas,monospace">  - key: antibody</text>
  <text x="720" y="786" font-size="12" fill="#334155" font-family="Consolas,monospace">    match: { detailUrlIncludes: ['/ab/'] }</text>
  <text x="720" y="808" font-size="12" fill="#334155" font-family="Consolas,monospace">  - key: elisa</text>
  <text x="720" y="830" font-size="12" fill="#334155" font-family="Consolas,monospace">    match: { detailUrlIncludes: ['/elisa/'] }</text>
  <text x="720" y="856" font-size="12" fill="#64748B">子串写宽一点即可（OR 语义）；没配 match 的栏目反查永远查不到它。</text>

  <text x="40" y="912" font-size="13.5" fill="#334155">一句话总结：<tspan font-weight="700">match 不决定抓什么、不决定存哪里，只负责在「URL 没带标签」时回答它属于哪个栏目。</tspan>正常爬取永远用不到它。</text>
  <text x="40" y="948" font-size="12.5" fill="#94A3B8">配套：entry-paginate-flow.svg（startUrl / startUrls 入口继承与翻页机制）</text>
</svg>
